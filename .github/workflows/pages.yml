name: Update semantic map and deploy share pages

on:
  push:
    branches:
      - main

  schedule:
    - cron: "15 2 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache word vectors
        uses: actions/cache@v5
        with:
          path: ~/gensim-data
          key: ${{ runner.os }}-gensim-glove-wiki-gigaword-50-v1

      - name: Build semantic map from published posts
        run: |
          python scripts/build_semantic_map.py
          python scripts/preview_semantic_map.py

      - name: Validate semantic map
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/semantic_map_explanations.test.cjs

      - name: Save updated semantic map for Streamlit
        run: |
          git add data/semantic_map.json data/semantic_map_preview.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update semantic map from published posts"
            git push origin HEAD:main
          fi

      - name: Build social share site
        run: python scripts/build_share_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
