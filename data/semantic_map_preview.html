    // Brain silhouette


    function crossProduct(
        origin,
        a,
        b
    ) {
        return (
            (
                a.x
                -
                origin.x
            )
            *
            (
                b.y
                -
                origin.y
            )
            -
            (
                a.y
                -
                origin.y
            )
            *
            (
                b.x
                -
                origin.x
            )
        );
    }


    function buildConvexHull(
        points
    ) {
        if (
            !points
            ||
            points.length
            <
            3
        ) {
            return (
                points
                    ?
                    points.slice()
                    :
                    []
            );
        }


        const sorted =
            points
                .slice()
                .sort(
                    (
                        a,
                        b
                    ) => (
                        a.x
                        ===
                        b.x
                            ?
                            a.y
                            -
                            b.y
                            :
                            a.x
                            -
                            b.x
                    )
                );


        const unique = [];


        sorted.forEach(
            (point) => {
                const previous =
                    unique.length
                        ?
                        unique[
                            unique.length
                            -
                            1
                        ]
                        :
                        null;

                if (
                    !previous
                    ||
                    Math.abs(
                        point.x
                        -
                        previous.x
                    )
                    >
                    0.000001
                    ||
                    Math.abs(
                        point.y
                        -
                        previous.y
                    )
                    >
                    0.000001
                ) {
                    unique.push(
                        point
                    );
                }
            }
        );


        if (
            unique.length
            <
            3
        ) {
            return unique;
        }


        const lower = [];


        unique.forEach(
            (point) => {
                while (
                    lower.length
                    >=
                    2

                    &&

                    crossProduct(
                        lower[
                            lower.length
                            -
                            2
                        ],

                        lower[
                            lower.length
                            -
                            1
                        ],

                        point
                    )
                    <=
                    0
                ) {
                    lower.pop();
                }

                lower.push(
                    point
                );
            }
        );


        const upper = [];


        for (
            let index =
                unique.length
                -
                1;

            index
            >=
            0;

            index -=
                1
        ) {
            const point =
                unique[index];

            while (
                upper.length
                >=
                2

                &&

                crossProduct(
                    upper[
                        upper.length
                        -
                        2
                    ],

                    upper[
                        upper.length
                        -
                        1
                    ],

                    point
                )
                <=
                0
            ) {
                upper.pop();
            }

            upper.push(
                point
            );
        }


        lower.pop();
        upper.pop();


        return lower.concat(
            upper
        );
    }


    function buildNormalizedBrainSilhouette(
        layer,
        brainPaths,
        brainPathTransform,
        brainViewBox,
        options
    ) {
        if (
            !brainPaths.length
        ) {
            return null;
        }


        const guideGroup =
            document.createElementNS(
                NS,
                "g"
            );

        guideGroup.setAttribute(
            "visibility",
            "hidden"
        );

        guideGroup.setAttribute(
            "pointer-events",
            "none"
        );

        if (
            brainPathTransform
        ) {
            guideGroup.setAttribute(
                "transform",
                brainPathTransform
            );
        }

        layer.svg.appendChild(
            guideGroup
        );


        const samples = [];


        brainPaths.forEach(
            (pathData) => {
                const path =
                    document.createElementNS(
                        NS,
                        "path"
                    );

                path.setAttribute(
                    "d",
                    pathData
                );

                path.setAttribute(
                    "fill",
                    "none"
                );

                path.setAttribute(
                    "stroke",
                    "none"
                );

                guideGroup.appendChild(
                    path
                );


                let totalLength =
                    0;

                try {
                    totalLength =
                        path.getTotalLength();

                } catch (
                    error
                ) {
                    totalLength =
                        0;
                }


                if (
                    !Number.isFinite(
                        totalLength
                    )
                    ||
                    totalLength
                    <=
                    0
                ) {
                    return;
                }


                const sampleCount =
                    clamp(
                        Math.ceil(
                            totalLength
                            /
                            options
                                .clipSampleSpacing
                        ),

                        options
                            .clipMinSamplesPerPath,

                        options
                            .clipMaxSamplesPerPath
                    );


                const matrix =
                    path.getCTM();

                if (
                    !matrix
                ) {
                    return;
                }


                for (
                    let index = 0;
                    index <= sampleCount;
                    index += 1
                ) {
                    const localPoint =
                        path.getPointAtLength(
                            totalLength
                            *
                            (
                                index
                                /
                                sampleCount
                            )
                        );


                    const svgPoint =
                        layer
                            .svg
                            .createSVGPoint();

                    svgPoint.x =
                        localPoint.x;

                    svgPoint.y =
                        localPoint.y;


                    const transformed =
                        svgPoint
                            .matrixTransform(
                                matrix
                            );


                    const nx =
                        (
                            transformed.x
                            -
                            brainViewBox
                                .minX
                        )
                        /
                        brainViewBox
                            .width;


                    const ny =
                        (
                            transformed.y
                            -
                            brainViewBox
                                .minY
                        )
                        /
                        brainViewBox
                            .height;


                    if (
                        Number.isFinite(
                            nx
                        )
                        &&
                        Number.isFinite(
                            ny
                        )
                        &&
                        nx
                        >=
                        -0.03
                        &&
                        nx
                        <=
                        1.03
                        &&
                        ny
                        >=
                        -0.03
                        &&
                        ny
                        <=
                        1.03
                    ) {
                        samples.push({
                            x:
                                nx,

                            y:
                                ny,
                        });
                    }
                }
            }
        );


        guideGroup.remove();


        if (
            samples.length
            <
            20
        ) {
            return null;
        }


        let hull =
            buildConvexHull(
                samples
            );


        if (
            hull.length
            <
            3
        ) {
            return null;
        }


        let minX =
            Infinity;

        let maxX =
            -Infinity;

        let minY =
            Infinity;

        let maxY =
            -Infinity;


        hull.forEach(
            (point) => {
                minX =
                    Math.min(
                        minX,
                        point.x
                    );

                maxX =
                    Math.max(
                        maxX,
                        point.x
                    );

                minY =
                    Math.min(
                        minY,
                        point.y
                    );

                maxY =
                    Math.max(
                        maxY,
                        point.y
                    );
            }
        );


        const centerX =
            (
                minX
                +
                maxX
            )
            /
            2;

        const centerY =
            (
                minY
                +
                maxY
            )
            /
            2;


        hull =
            hull.map(
                (point) => ({
                    x:
                        centerX
                        +
                        (
                            point.x
                            -
                            centerX
                        )
                        *
                        options
                            .clipRadialScale,

                    y:
                        centerY
                        +
                        (
                            point.y
                            -
                            centerY
                        )
                        *
                        options
                            .clipRadialScale,
                })
            );


        return {
            centerX,
            centerY,
            points:
                hull,
        };
    }


    function fallbackNormalizedSilhouette() {
        const points = [];
        const count = 180;


        for (
            let index = 0;
            index < count;
            index += 1
        ) {
            const angle =
                TWO_PI
                *
                index
                /
                count;

            points.push({
                x:
                    0.5
                    +
                    Math.cos(
                        angle
                    )
                    *
                    0.47,

                y:
                    0.5
                    +
                    Math.sin(
                        angle
                    )
                    *
                    0.49,
            });
        }


        return {
            centerX:
                0.5,

            centerY:
                0.5,

            points,
        };
    }


    function updateBrainClip(
        layer,
        silhouette,
        dataToPixel,
        brainBounds,
        options
    ) {
        const topLeft =
            dataToPixel(
                -brainBounds
                    .xRadius,

                brainBounds
                    .yRadius
            );


        const bottomRight =
            dataToPixel(
                brainBounds
                    .xRadius,

                -brainBounds
                    .yRadius
            );


        const left =
            Math.min(
                topLeft.x,
                bottomRight.x
            );

        const right =
            Math.max(
                topLeft.x,
                bottomRight.x
            );

        const top =
            Math.min(
                topLeft.y,
                bottomRight.y
            );

        const bottom =
            Math.max(
                topLeft.y,
                bottomRight.y
            );

        const width =
            right
            -
            left;

        const height =
            bottom
            -
            top;


        const center = {
            x:
                left
                +
                silhouette
                    .centerX
                *
                width,

            y:
                top
                +
                silhouette
                    .centerY
                *
                height,
        };


        const mappedPoints =
            silhouette
                .points
                .map(
                    (point) => {
                        let x =
                            left
                            +
                            point.x
                            *
                            width;

                        let y =
                            top
                            +
                            point.y
                            *
                            height;


                        const dx =
                            x
                            -
                            center.x;

                        const dy =
                            y
                            -
                            center.y;

                        const distance =
                            Math.max(
                                Math.hypot(
                                    dx,
                                    dy
                                ),
                                0.000001
                            );


                        const safeDistance =
                            Math.max(
                                0,

                                distance
                                -
                                options
                                    .clipSafetyPixels
                            );


                        const factor =
                            safeDistance
                            /
                            distance;


                        x =
                            center.x
                            +
                            dx
                            *
                            factor;

                        y =
                            center.y
                            +
                            dy
                            *
                            factor;


                        return {
                            x,
                            y,
                        };
                    }
                );


        if (
            !mappedPoints.length
        ) {
            layer
                .clipShape
                .setAttribute(
                    "d",
                    ""
                );

            return;
        }


        let path =
            "M "
            +
            mappedPoints[0]
                .x
                .toFixed(
                    2
                )
            +
            " "
            +
            mappedPoints[0]
                .y
                .toFixed(
                    2
                );


        for (
            let index = 1;
            index < mappedPoints.length;
            index += 1
        ) {
            path +=
                " L "
                +
                mappedPoints[index]
                    .x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                mappedPoints[index]
                    .y
                    .toFixed(
                        2
                    );
        }


        path +=
            " Z";


        layer
            .clipShape
            .setAttribute(
                "d",
                path
            );
    }


    // Branch gradients


    function createBranchGradient(
        layer,
        id,
        color,
        start,
        tip,
        opacityNear,
        opacityMid,
        opacityFar
    ) {
        const gradient =
            document.createElementNS(
                NS,
                "linearGradient"
            );

        gradient.classList.add(
            "neural-dynamic-def"
        );

        gradient.setAttribute(
            "id",
            id
        );

        gradient.setAttribute(
            "gradientUnits",
            "userSpaceOnUse"
        );

        gradient.setAttribute(
            "x1",
            String(
                start.x
            )
        );

        gradient.setAttribute(
            "y1",
            String(
                start.y
            )
        );

        gradient.setAttribute(
            "x2",
            String(
                tip.x
            )
        );

        gradient.setAttribute(
            "y2",
            String(
                tip.y
            )
        );


        [
            [
                "0%",
                opacityNear,
            ],

            [
                "48%",
                opacityMid,
            ],

            [
                "100%",
                opacityFar,
            ],
        ].forEach(
            (
                [
                    offset,
                    opacity,
                ]
            ) => {
                const stop =
                    document.createElementNS(
                        NS,
                        "stop"
                    );

                stop.setAttribute(
                    "offset",
                    offset
                );

                stop.setAttribute(
                    "stop-color",
                    color
                );

                stop.setAttribute(
                    "stop-opacity",
                    String(
                        opacity
                    )
                );

                gradient.appendChild(
                    stop
                );
            }
        );


        layer
            .defs
            .appendChild(
                gradient
            );


        return (
            "url(#"
            +
            id
            +
            ")"
        );
    }


    // Dendrites


    function buildDendrite(
        origin,
        angle,
        length,
        key,
        index,
        options
    ) {
        const direction = {
            x:
                Math.cos(
                    angle
                ),

            y:
                Math.sin(
                    angle
                ),
        };


        const normal = {
            x:
                -direction.y,

            y:
                direction.x,
        };


        const curvature =
            lerp(
                options
                    .branchCurveMin,

                options
                    .branchCurveMax,

                seededUnit(
                    key,
                    5000
                    +
                    index
                )
            );


        const bend =
            seededSigned(
                key,
                5100
                +
                index
            )
            *
            length
            *
            curvature;


        const tipAngle =
            angle
            +
            seededSigned(
                key,
                5200
                +
                index
            )
            *
            options
                .branchAngleJitter;


        const tipDirection = {
            x:
                Math.cos(
                    tipAngle
                ),

            y:
                Math.sin(
                    tipAngle
                ),
        };


        const tip = {
            x:
                origin.x
                +
                tipDirection.x
                *
                length,

            y:
                origin.y
                +
                tipDirection.y
                *
                length,
        };


        const control1 = {
            x:
                origin.x
                +
                direction.x
                *
                length
                *
                0.30
                +
                normal.x
                *
                bend
                *
                0.55,

            y:
                origin.y
                +
                direction.y
                *
                length
                *
                0.30
                +
                normal.y
                *
                bend
                *
                0.55,
        };


        const control2 = {
            x:
                origin.x
                +
                direction.x
                *
                length
                *
                0.70
                -
                normal.x
                *
                bend
                *
                0.28,

            y:
                origin.y
                +
                direction.y
                *
                length
                *
                0.70
                -
                normal.y
                *
                bend
                *
                0.28,
        };


        const terminal =
            normalize(
                tip.x
                -
                control2.x,

                tip.y
                -
                control2.y
            );


        return {
            d:
                "M "
                +
                origin.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                origin.y
                    .toFixed(
                        2
                    )
                +
                " C "
                +
                control1.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                control1.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                control2.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                control2.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                tip.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                tip.y
                    .toFixed(
                        2
                    ),

            tip,

            terminalAngle:
                Math.atan2(
                    terminal.y,
                    terminal.x
                ),

            length,
        };
    }


    function buildTerminalTwig(
        origin,
        angle,
        length,
        key,
        index,
        options
    ) {
        const direction = {
            x:
                Math.cos(
                    angle
                ),

            y:
                Math.sin(
                    angle
                ),
        };


        const normal = {
            x:
                -direction.y,

            y:
                direction.x,
        };


        const curve =
            lerp(
                options
                    .terminalCurveMin,

                options
                    .terminalCurveMax,

                seededUnit(
                    key,
                    7000
                    +
                    index
                )
            );


        const bend =
            seededSigned(
                key,
                7100
                +
                index
            )
            *
            length
            *
            curve;


        const tipAngle =
            angle
            +
            seededSigned(
                key,
                7200
                +
                index
            )
            *
            0.08;


        const tipDirection = {
            x:
                Math.cos(
                    tipAngle
                ),

            y:
                Math.sin(
                    tipAngle
                ),
        };


        const tip = {
            x:
                origin.x
                +
                tipDirection.x
                *
                length,

            y:
                origin.y
                +
                tipDirection.y
                *
                length,
        };


        const control1 = {
            x:
                origin.x
                +
                direction.x
                *
                length
                *
                0.34
                +
                normal.x
                *
                bend
                *
                0.50,

            y:
                origin.y
                +
                direction.y
                *
                length
                *
                0.34
                +
                normal.y
                *
                bend
                *
                0.50,
        };


        const control2 = {
            x:
                origin.x
                +
                direction.x
                *
                length
                *
                0.72
                -
                normal.x
                *
                bend
                *
                0.20,

            y:
                origin.y
                +
                direction.y
                *
                length
                *
                0.72
                -
                normal.y
                *
                bend
                *
                0.20,
        };


        return {
            d:
                "M "
                +
                origin.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                origin.y
                    .toFixed(
                        2
                    )
                +
                " C "
                +
                control1.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                control1.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                control2.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                control2.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                tip.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                tip.y
                    .toFixed(
                        2
                    ),

            tip,
        };
    }


    function drawGradientPath(
        layer,
        pathData,
        start,
        tip,
        color,
        idBase,
        coreWidth,
        haloWidth,
        coreOpacities,
        haloOpacities,
        style
    ) {
        const widthScale =
            style.widthScale
            ===
            undefined
                ?
                1
                :
                style.widthScale;


        const opacityScale =
            style.opacityScale
            ===
            undefined
                ?
                1
                :
                style.opacityScale;


        const glowScale =
            style.glowScale
            ===
            undefined
                ?
                1
                :
                style.glowScale;


        const haloStroke =
            createBranchGradient(
                layer,
                `${idBase}-halo`,
                color,
                start,
                tip,

                haloOpacities[0]
                *
                opacityScale
                *
                glowScale,

                haloOpacities[1]
                *
                opacityScale
                *
                glowScale,

                haloOpacities[2]
                *
                opacityScale
                *
                glowScale
            );


        const coreStroke =
            createBranchGradient(
                layer,
                `${idBase}-core`,
                color,
                start,
                tip,

                coreOpacities[0]
                *
                opacityScale,

                coreOpacities[1]
                *
                opacityScale,

                coreOpacities[2]
                *
                opacityScale
            );


        createPathElement(
            layer,
            {
                d:
                    pathData,

                stroke:
                    haloStroke,

                width:
                    haloWidth
                    *
                    widthScale,

                opacity:
                    1,

                glow:
                    true,
            }
        );


        createPathElement(
            layer,
            {
                d:
                    pathData,

                stroke:
                    coreStroke,

                width:
                    coreWidth
                    *
                    widthScale,

                opacity:
                    1,

                glow:
                    false,
            }
        );
    }


    function drawDendriteWithTerminalSplit(
        layer,
        origin,
        angle,
        length,
        key,
        branchIndex,
        color,
        idBase,
        options,
        style
    ) {
        const dendrite =
            buildDendrite(
                origin,
                angle,
                length,
                key,
                branchIndex,
                options
            );


        drawGradientPath(
            layer,
            dendrite.d,
            origin,
            dendrite.tip,
            color,
            idBase,

            options
                .branchCoreWidth,

            options
                .branchHaloWidth,

            [
                options
                    .branchCoreOpacityNear,

                options
                    .branchCoreOpacityMid,

                options
                    .branchCoreOpacityFar,
            ],

            [
                options
                    .branchHaloOpacityNear,

                options
                    .branchHaloOpacityMid,

                options
                    .branchHaloOpacityFar,
            ],

            style
        );


        const ratioA =
            lerp(
                options
                    .terminalLengthRatioMin,

                options
                    .terminalLengthRatioMax,

                seededUnit(
                    key,
                    8000
                    +
                    branchIndex
                    *
                    7
                )
            );


        const ratioB =
            lerp(
                options
                    .terminalLengthRatioMin,

                options
                    .terminalLengthRatioMax,

                seededUnit(
                    key,
                    8001
                    +
                    branchIndex
                    *
                    7
                )
            );


        const divergenceA =
            lerp(
                options
                    .terminalAngleMin,

                options
                    .terminalAngleMax,

                seededUnit(
                    key,
                    8002
                    +
                    branchIndex
                    *
                    7
                )
            );


        const divergenceB =
            lerp(
                options
                    .terminalAngleMin,

                options
                    .terminalAngleMax,

                seededUnit(
                    key,
                    8003
                    +
                    branchIndex
                    *
                    7
                )
            );


        const skew =
            seededSigned(
                key,
                8004
                +
                branchIndex
                *
                7
            )
            *
            0.12;


        const twigAngles = [
            dendrite
                .terminalAngle
            +
            divergenceA
            +
            skew,

            dendrite
                .terminalAngle
            -
            divergenceB
            +
            skew
            *
            0.42,
        ];


        const twigLengths = [
            dendrite
                .length
            *
            ratioA,

            dendrite
                .length
            *
            ratioB,
        ];


        twigAngles.forEach(
            (
                twigAngle,
                twigIndex
            ) => {
                const twig =
                    buildTerminalTwig(
                        dendrite.tip,
                        twigAngle,
                        twigLengths[
                            twigIndex
                        ],
                        `${key}|terminal`,
                        branchIndex
                        *
                        2
                        +
                        twigIndex,
                        options
                    );


                drawGradientPath(
                    layer,
                    twig.d,
                    dendrite.tip,
                    twig.tip,
                    color,

                    `${idBase}-terminal-${twigIndex}`,

                    options
                        .terminalCoreWidth,

                    options
                        .terminalHaloWidth,

                    [
                        options
                            .terminalCoreOpacityNear,

                        options
                            .terminalCoreOpacityMid,

                        options
                            .terminalCoreOpacityFar,
                    ],

                    [
                        options
                            .terminalHaloOpacityNear,

                        options
                            .terminalHaloOpacityMid,

                        options
                            .terminalHaloOpacityFar,
                    ],

                    {
                        widthScale:
                            style.widthScale
                            *
                            0.92,

                        opacityScale:
                            style.opacityScale
                            *
                            0.92,

                        glowScale:
                            style.glowScale
                            *
                            0.86,
                    }
                );
            }
        );
    }


    function drawNodeArbor(
        layer,
        origin,
        nodeKey,
        color,
        count,
        lengthMin,
        lengthMax,
        options,
        gradientIdPrefix,
        style
    ) {
        const adjustedCount =
            Math.max(
                2,

                Math.round(
                    count
                    *
                    style.countScale
                )
            );


        const angles =
            buildIrregularAngles(
                nodeKey,
                adjustedCount,
                options,
                10000
            );


        angles.forEach(
            (
                angle,
                index
            ) => {
                const finalAngle =
                    angle
                    +
                    seededSigned(
                        nodeKey,
                        11000
                        +
                        index
                    )
                    *
                    options
                        .branchAngleJitter;


                const length =
                    lerp(
                        lengthMin,
                        lengthMax,

                        seededUnit(
                            nodeKey,
                            12000
                            +
                            index
                        )
                    )
                    *
                    style.lengthScale;


                drawDendriteWithTerminalSplit(
                    layer,
                    origin,
                    finalAngle,
                    length,
                    nodeKey,
                    index,
                    color,
                    `${gradientIdPrefix}-${index}`,
                    options,

                    {
                        widthScale:
                            style.widthScale,

                        opacityScale:
                            style.opacityScale,

                        glowScale:
                            style.glowScale,
                    }
                );
            }
        );
    }


    // Node highlights


    function drawTreeNodeHighlight(
        layer,
        point,
        node,
        depth,
        color,
        profile
    ) {
        const weight =
            clamp(
                numberOr(
                    node.weight,
                    3
                ),
                1,
                6
            );


        const baseRadius =
            7.8
            +
            weight
            *
            0.72;


        const radius =
            baseRadius
            *
            profile
                .highlightScale;


        createCircleElement(
            layer,
            {
                x:
                    point.x,

                y:
                    point.y,

                radius:
                    radius
                    +
                    2.4,

                fill:
                    "none",

                stroke:
                    color,

                width:
                    4.2
                    *
                    profile
                        .lineWidth,

                opacity:
                    0.10
                    *
                    profile
                        .glow
                    *
                    profile
                        .highlightOpacity,

                glow:
                    true,

                unclipped:
                    true,
            }
        );


        createCircleElement(
            layer,
            {
                x:
                    point.x,

                y:
                    point.y,

                radius,

                fill:
                    "none",

                stroke:
                    color,

                width:
                    Math.max(
                        0.65,

                        1.45
                        *
                        profile
                            .lineWidth
                    ),

                opacity:
                    profile
                        .highlightOpacity,

                glow:
                    false,

                unclipped:
                    true,
            }
        );


        if (
            depth
            ===
            1
        ) {
            createCircleElement(
                layer,
                {
                    x:
                        point.x,

                    y:
                        point.y,

                    radius:
                        Math.max(
                            2.1,

                            radius
                            *
                            0.28
                        ),

                    fill:
                        color,

                    stroke:
                        "none",

                    width:
                        0,

                    opacity:
                        0.11
                        *
                        profile
                            .highlightOpacity,

                    glow:
                        false,
                }
            );
        }
    }


    function hideLegacyNeighborHighlight(
        gd
    ) {
        const index =
            gd.data.findIndex(
                (trace) => (
                    (
                        trace.meta
                        ||
                        {}
                    ).layer
                    ===
                    "neighbor-highlight"
                )
            );


        if (
            index
            <
            0
        ) {
            return;
        }


        if (
            gd.data[
                index
            ].visible
            ===
            false
        ) {
            return;
        }


        Plotly.restyle(
            gd,
            {
                visible:
                    false,
            },
            [
                index,
            ]
        );
    }


    // Moving signal


    function animateSignal(
        layer,
        guidePath,
        color,
        edgeIndex,
        options,
        profile
    ) {
        if (
            !options
                .signalEnabled
            ||
            profile
                .signalOpacity
            <=
            0
        ) {
            return;
        }


        const totalLength =
            guidePath.getTotalLength();


        if (
            !Number.isFinite(
                totalLength
            )
            ||
            totalLength
            <=
            options
                .signalLength
        ) {
            return;
        }


        const signal =
            document.createElementNS(
                NS,
                "path"
            );

        signal.classList.add(
            "neural-dynamic"
        );

        signal.setAttribute(
            "d",
            guidePath.getAttribute(
                "d"
            )
        );

        signal.setAttribute(
            "fill",
            "none"
        );

        signal.setAttribute(
            "stroke",
            color
        );

        signal.setAttribute(
            "stroke-width",

            String(
                options
                    .signalWidth
                *
                profile
                    .signalWidth
            )
        );

        signal.setAttribute(
            "stroke-linecap",
            "round"
        );

        signal.setAttribute(
            "stroke-linejoin",
            "round"
        );

        signal.setAttribute(
            "stroke-dasharray",

            options
                .signalLength
            +
            " "
            +
            (
                totalLength
                +
                options
                    .signalLength
            )
        );

        signal.setAttribute(
            "stroke-dashoffset",

            String(
                totalLength
                +
                options
                    .signalLength
            )
        );

        signal.setAttribute(
            "opacity",
            "0"
        );

        signal.setAttribute(
            "filter",
            "url(#semantic-neural-module-glow)"
        );

        signal.setAttribute(
            "vector-effect",
            "non-scaling-stroke"
        );

        layer
            .content
            .appendChild(
                signal
            );


        const duration =
            options
                .signalDuration
            +
            seededUnit(
                guidePath.getAttribute(
                    "d"
                ),

                13000
                +
                edgeIndex
            )
            *
            options
                .signalDurationJitter;


        const gap =
            options
                .signalGap
            +
            seededUnit(
                guidePath.getAttribute(
                    "d"
                ),

                14000
                +
                edgeIndex
            )
            *
            options
                .signalGapJitter;


        const initialDelay =
            edgeIndex
            *
            95
            +
            seededUnit(
                guidePath.getAttribute(
                    "d"
                ),

                15000
                +
                edgeIndex
            )
            *
            500;


        function run() {
            if (
                !signal
                    .isConnected
            ) {
                return;
            }


            const startedAt =
                performance.now();


            function frame(
                timestamp
            ) {
                if (
                    !signal
                        .isConnected
                ) {
                    return;
                }


                const progress =
                    clamp(
                        (
                            timestamp
                            -
                            startedAt
                        )
                        /
                        duration,

                        0,
                        1
                    );


                const eased =
                    1
                    -
                    Math.pow(
                        1
                        -
                        progress,

                        1.65
                    );


                const startOffset =
                    totalLength
                    +
                    options
                        .signalLength;


                const endOffset =
                    -options
                        .signalLength;


                const offset =
                    startOffset
                    +
                    (
                        endOffset
                        -
                        startOffset
                    )
                    *
                    eased;


                const visibility =
                    Math.pow(
                        Math.sin(
                            Math.PI
                            *
                            progress
                        ),

                        0.55
                    );


                signal.setAttribute(
                    "stroke-dashoffset",
                    String(
                        offset
                    )
                );


                signal.setAttribute(
                    "opacity",

                    String(
                        options
                            .signalOpacity
                        *
                        profile
                            .signalOpacity
                        *
                        visibility
                    )
                );


                if (
                    progress
                    <
                    1
                ) {
                    requestAnimationFrame(
                        frame
                    );

                    return;
                }


                signal.setAttribute(
                    "opacity",
                    "0"
                );


                window.setTimeout(
                    run,
                    gap
                );
            }


            requestAnimationFrame(
                frame
            );
        }


        window.setTimeout(
            run,
            initialDelay
        );
    }


    // Manager


    function createManager(
        config
    ) {
        const gd =
            config.gd;

        const nodes =
            config.nodes
            ||
            [];

        const rawEdges =
            config.edges
            ||
            [];

        const colors =
            config.colors
            ||
            {};

        const dataToPixel =
            config.dataToPixel;


        const brainPaths =
            config.brainPaths
            ||
            GLOBAL_CONFIG
                .brainPaths
            ||
            [];


        const brainPathTransform =
            config
                .brainPathTransform
            ||
            GLOBAL_CONFIG
                .brainPathTransform
            ||
            "";


        const brainViewBox =
            config
                .brainViewBox
            ||
            GLOBAL_CONFIG
                .brainViewBox
            ||
            {
                minX:
                    0,

                minY:
                    0,

                width:
                    1122,

                height:
                    1402,
            };


        const brainBounds =
            config
                .brainBounds
            ||
            GLOBAL_CONFIG
                .brainBounds
            ||
            {
                xRadius:
                    1.06,

                yRadius:
                    1.325,
            };


        const options = {
            ...DEFAULTS,

            ...(
                config.options
                ||
                {}
            ),

            depthProfiles: {
                ...DEFAULTS
                    .depthProfiles,

                ...(
                    (
                        config.options
                        ||
                        {}
                    ).depthProfiles
                    ||
                    {}
                ),
            },
        };


        if (
            !gd
        ) {
            throw new Error(
                "PrintHumanNeural: missing gd"
            );
        }


        if (
            typeof dataToPixel
            !==
            "function"
        ) {
            throw new Error(
                "PrintHumanNeural: missing dataToPixel()"
            );
        }


        const nodesByTag =
            new Map(
                nodes.map(
                    (node) => [
                        node.tag,
                        node,
                    ]
                )
            );


        const graphEdges =
            buildGraphEdges(
                nodes,
                rawEdges
            );


        const layer =
            createLayer(
                gd
            );


        const silhouette =
            buildNormalizedBrainSilhouette(
                layer,
                brainPaths,
                brainPathTransform,
                brainViewBox,
                options
            )
            ||
            fallbackNormalizedSilhouette();


        let activeTag =
            null;

        let activeTree =
            null;


        function updateClip() {
            updateBrainClip(
                layer,
                silhouette,
                dataToPixel,
                brainBounds,
                options
            );
        }


        function clearVisuals() {
            layer
                .svg
                .querySelectorAll(
                    ".neural-dynamic"
                )
                .forEach(
                    (element) => {
                        element.remove();
                    }
                );


            layer
                .defs
                .querySelectorAll(
                    ".neural-dynamic-def"
                )
                .forEach(
                    (element) => {
                        element.remove();
                    }
                );
        }


        function clear() {
            activeTag =
                null;

            activeTree =
                null;

            clearVisuals();
        }


        function profileForDepth(
            depth
        ) {
            return (
                options
                    .depthProfiles[
                        depth
                    ]

                ||

                options
                    .depthProfiles[
                        options
                            .maxDepth
                    ]

                ||

                options
                    .depthProfiles[
                        3
                    ]
            );
        }


        function drawMainConnection(
            parentPixel,
            childPixel,
            relation,
            edgeIndex,
            depth,
            neuralColor,
            pulseColor
        ) {
            const profile =
                profileForDepth(
                    depth
                );


            const key =
                activeTag
                +
                "|"
                +
                relation.parent
                +
                "|"
                +
                relation.child
                +
                "|"
                +
                depth;


            const geometry =
                buildOrganicMainPath(
                    parentPixel,
                    childPixel,
                    key,
                    options
                );


            const strength =
                clamp(
                    numberOr(
                        relation
                            .edge
                            .strength,

                        0
                    ),

                    0,
                    1
                );


            const flowLoad =
                clamp(
                    numberOr(
                        relation.flowLoad,
                        strength
                    ),
                    0,
                    1
                );


            const flowWidthScale =
                options.flowWidthBase
                +
                options.flowWidthGain
                *
                Math.pow(
                    flowLoad,
                    options.flowWidthExponent
                );


            createPathElement(
                layer,
                {
                    d:
                        geometry.d,

                    stroke:
                        neuralColor,

                    width:
                        (
                            options
                                .mainHaloWidth

                            +

                            strength
                            *
                            options
                                .mainHaloStrengthWidth
                        )
                        *
                        profile
                            .lineWidth
                        *
                        flowWidthScale,

                    opacity:
                        options
                            .mainHaloOpacity
                        *
                        profile
                            .lineOpacity
                        *
                        profile
                            .glow,

                    glow:
                        true,
                }
            );


            const core =
                createPathElement(
                    layer,
                    {
                        d:
                            geometry.d,

                        stroke:
                            neuralColor,

                        width:
                            (
                                options
                                    .mainCoreWidth

                                +

                                strength
                                *
                                options
                                    .mainStrengthWidth
                            )
                            *
                            profile
                                .lineWidth
                            *
                            flowWidthScale,

                        opacity:
                            options
                                .mainCoreOpacity
                            *
                            profile
                                .lineOpacity,

                        glow:
                            false,
                    }
                );


            animateSignal(
                layer,
                core,
                pulseColor,
                edgeIndex,
                options,
                profile
            );
        }


        function drawReachedNode(
            tag,
            depth,
            neuralColor
        ) {
            const node =
                nodesByTag.get(
                    tag
                );


            if (
                !node
            ) {
                return;
            }


            const point =
                dataToPixel(
                    node.x,
                    node.y
                );


            const profile =
                profileForDepth(
                    depth
                );


            const countBase =
                seededInteger(
                    "tree-target|"
                    +
                    activeTag
                    +
                    "|"
                    +
                    tag,

                    16000
                    +
                    depth,

                    options
                        .targetBranchesMin,

                    options
                        .targetBranchesMax
                );


            drawTreeNodeHighlight(
                layer,
                point,
                node,
                depth,
                neuralColor,
                profile
            );


            drawNodeArbor(
                layer,
                point,

                "tree-arbor|"
                +
                activeTag
                +
                "|"
                +
                tag
                +
                "|"
                +
                depth,

                neuralColor,
                countBase,

                options
                    .targetBranchLengthMin,

                options
                    .targetBranchLengthMax,

                options,

                "semantic-tree-"
                +
                hashValue(
                    activeTag
                    +
                    "|"
                    +
                    tag
                    +
                    "|"
                    +
                    depth
                ),

                {
                    countScale:
                        profile
                            .arborCount,

                    lengthScale:
                        profile
                            .arborLength,

                    widthScale:
                        profile
                            .lineWidth,

                    opacityScale:
                        profile
                            .arborOpacity,

                    glowScale:
                        profile
                            .glow,
                }
            );
        }


        function draw(
            tag
        ) {
            activeTag =
                tag
                ||
                null;


            clearVisuals();
            updateClip();


            if (
                !activeTag
                ||
                !nodesByTag.has(
                    activeTag
                )
            ) {
                activeTree =
                    null;

                return;
            }


            hideLegacyNeighborHighlight(
                gd
            );


            activeTree =
                buildSemanticTree(
                    activeTag,
                    graphEdges,
                    options
                );


            annotateTreeFlow(
                activeTree,
                options
            );


            const selectedNode =
                nodesByTag.get(
                    activeTag
                );


            const selectedPixel =
                dataToPixel(
                    selectedNode.x,
                    selectedNode.y
                );


            const neuralColor =
                colors.neural
                ||
                colors.primary
                ||
                "#FFFFFF";


            const pulseColor =
                colors.pulse
                ||
                colors.primary
                ||
                "#FFFFFF";


            activeTree
                .treeEdges
                .forEach(
                    (
                        relation,
                        edgeIndex
                    ) => {
                        const parentNode =
                            nodesByTag.get(
                                relation.parent
                            );

                        const childNode =
                            nodesByTag.get(
                                relation.child
                            );


                        if (
                            !parentNode
                            ||
                            !childNode
                        ) {
                            return;
                        }


                        const parentPixel =
                            dataToPixel(
                                parentNode.x,
                                parentNode.y
                            );


                        const childPixel =
                            dataToPixel(
                                childNode.x,
                                childNode.y
                            );


                        drawMainConnection(
                            parentPixel,
                            childPixel,
                            relation,
                            edgeIndex,
                            relation.depth,
                            neuralColor,
                            pulseColor
                        );
                    }
                );


            const reached =
                Array.from(
                    activeTree
                        .depthByTag
                        .entries()
                )
                .filter(
                    (
                        [
                            nodeTag,
                            depth,
                        ]
                    ) => (
                        nodeTag
                        !==
                        activeTag

                        &&

                        depth
                        >
                        0
                    )
                )
                .sort(
                    (
                        a,
                        b
                    ) => (
                        a[1]
                        -
                        b[1]
                    )
                );


            reached.forEach(
                (
                    [
                        nodeTag,
                        depth,
                    ]
                ) => {
                    drawReachedNode(
                        nodeTag,
                        depth,
                        neuralColor
                    );
                }
            );


            const selectedCount =
                seededInteger(
                    "selected|"
                    +
                    activeTag,

                    17000,

                    options
                        .selectedBranchesMin,

                    options
                        .selectedBranchesMax
                );


            drawNodeArbor(
                layer,
                selectedPixel,

                "selected-arbor|"
                +
                activeTag,

                neuralColor,
                selectedCount,

                options
                    .selectedBranchLengthMin,

                options
                    .selectedBranchLengthMax,

                options,

                "semantic-selected-"
                +
                hashValue(
                    activeTag
                ),

                {
                    countScale:
                        1,

                    lengthScale:
                        1,

                    widthScale:
                        1,

                    opacityScale:
                        1,

                    glowScale:
                        1,
                }
            );
        }


        function redraw() {
            updateClip();

            if (
                activeTag
            ) {
                draw(
                    activeTag
                );
            }
        }


        function destroy() {
            activeTag =
                null;

            activeTree =
                null;

            clearVisuals();

            layer
                .svg
                .remove();
        }


        updateClip();


        return {
            draw,
            redraw,
            clear,
            destroy,

            get activeTag() {
                return activeTag;
            },

            get activeTree() {
                return activeTree;
            },
        };
    }


    // Public API


    window.PrintHumanNeural = {
        create:
            createManager,
        // Tree and load calculations shared by the map and explanations.
        explain(rootTag, nodes, edges) {
            const graphEdges = buildGraphEdges(nodes, edges);
            const options = {...DEFAULTS};
            const direct = incidentEdges(graphEdges, rootTag);
            const rootFloor = Math.max(
                options.rootBranchAbsoluteFloor,
                numberOr(direct[0] && direct[0].strength, 0) * options.rootBranchRelativeFloor
            );
            return {
                tree: annotateTreeFlow(buildSemanticTree(rootTag, graphEdges, options), options),
                options,
                rootFloor,
            };
        },
        priority: edgePriority,
    };

})();

(function () {
    "use strict";

    const NS = "http://www.w3.org/2000/svg";

    const DEFAULTS = {
        minGuideLength: 120,

        travelRatioMin: 0.10,
        travelRatioMax: 0.22,
        minTravelLength: 420,
        maxTravelLength: 1800,

        durationMin: 760,
        durationMax: 1080,

        illuminationRadiusMin: 760,
        illuminationRadiusMax: 1320,
        illuminationOpacity: 0.96,

        intervalMax: 4200,
        initialDelay: 650,

        doubleFlashChance: 0.18,
        doubleFlashDelayMin: 120,
        doubleFlashDelayMax: 240,

    // Utilities


    function clamp(value, minimum, maximum) {
        return Math.max(
            minimum,
            Math.min(
                maximum,
                value
            )
        );
    }


    function randomBetween(minimum, maximum) {
        return (
            minimum
            +
            Math.random()
            *
            (
                maximum
                -
                minimum
            )
        );
    }


    function flashEnvelope(progress) {
        if (progress <= 0.10) {
            return (
                progress
                /
                0.10
            );
        }

        if (progress <= 0.58) {
            const local =
                (
                    progress
                    -
                    0.10
                )
                /
                0.48;

            return (
                1
                -
                local
                *
                0.10
            );
        }

        const local =
            (
                progress
                -
                0.58
            )
            /
            0.42;

        return (
            0.90
            *
            Math.pow(
                Math.max(
                    0,
                    1
                    -
                    local
                ),
                1.35
            )
        );
    }


    function travelEase(progress) {
        return (
            1
            -
            Math.pow(
                1
                -
                progress,
                1.45
            )
        );
    }


    // SVG layer


    function createLayer(config) {
