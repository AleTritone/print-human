sità, trasformando linearmente il valore dalla scala 0.00–1.00 alla scala 1.00–5.00.","legend_recurrence":"R = ricorrenza","legend_connections":"C = connessioni","legend_activation":"A = attivazione","legend_intensity":"I = intensità","scale_title":"La valutazione qualitativa segue il valore di intensità mostrato, arrotondato a due decimali:","scale_1":"1.00 ≤ I < 2.00 → {label}","scale_2":"2.00 ≤ I < 3.00 → {label}","scale_3":"3.00 ≤ I < 4.00 → {label}","scale_4":"4.00 ≤ I < 5.00 → {label}","scale_5":"I = 5.00 → {label}","footer":"I valori mostrati (R, C, A e I) sono relativi alla mappa corrente.","recurrence_definition":"Ricorrenza: frequenza relativa con cui l’idea compare nelle pubblicazioni di print(\"human\").","connections_definition":"Connessioni: numero relativo di associazioni dirette dell’idea nella mappa semantica.","normalization_intro":"I due valori vengono normalizzati rispetto ai massimi osservati nella mappa corrente:","where_title":"dove:","rx_definition":"r_x = numero di pubblicazioni in cui compare l’idea selezionata","rmax_definition":"r_max = massimo numero di pubblicazioni raggiunto da una singola idea","cx_definition":"c_x = numero di associazioni dirette dell’idea selezionata","cmax_definition":"c_max = massimo numero di associazioni dirette raggiunto da una singola idea"},"circuit":{"title":"Circuito","intro":"Un circuito è un gruppo di idee che la mappa riconosce come particolarmente connesse tra loro. Il suo nome deriva dalle idee centrali, chiamate core.","steps":[{"title":"Dalle affinità ai gruppi","body":"Per ogni idea si conservano i k vicini con maggiore attrazione associativa. Un collegamento entra nel grafo se viene scelto da almeno una delle due idee. Si parte poi da gruppi di una sola idea e si uniscono quelli che aumentano maggiormente la modularità Q: quanto le associazioni interne superano ciò che ci si aspetterebbe dalle forze complessive dei nodi."},{"title":"Misurare la centralità nel circuito","body":"Per scegliere i core si combinano forza dei legami interni, vicinanza lungo la rete e intensità. Ogni ingrediente viene diviso per il massimo osservato nel circuito. Il punteggio q resta così confrontabile tra i suoi membri."},{"title":"Scegliere le idee core","body":"Si confronta ogni punteggio con il migliore del circuito. La linea tratteggiata nel grafico indica la soglia di selezione. Le idee sopra la soglia vengono ordinate per punteggio e si conservano al massimo tre core."},{"title":"Leggere il circuito selezionato","body":"I cerchi pieni indicano i core; l’anello tratteggiato identifica l’idea selezionata. Le linee mostrano le associazioni del grafo di disposizione interne al circuito. L’appartenenza riguarda il gruppo nel suo insieme: non richiede un legame forte tra ogni coppia."}],"definitions_graph":[["N","Numero di idee con dati sufficienti a costruire il grafo; k non può superare N − 1. Con meno di due idee non si creano collegamenti."],["w_c","Somma dei pesi dei collegamenti interni al circuito c, contati una volta."],["s_c","Somma delle forze di tutti i nodi del circuito, includendo i collegamenti verso l’esterno."],["m","Somma dei pesi di tutti i collegamenti della mappa. Q valuta l’intera suddivisione in circuiti."]],"definitions_core":[["dₓ / Dₓ","dₓ somma i pesi dei legami interni dell’idea; Dₓ è il valore normalizzato."],["cₓ / Cₓ","cₓ misura la vicinanza agli altri membri lungo i percorsi più brevi, usando distanza 1/peso. Considera anche quanti membri sono raggiungibili; Cₓ è normalizzata."],["iₓ / Iₓ","iₓ è l’intensità sulla scala 1–5; qui Iₓ la divide per la massima intensità del circuito."],["qₓ","Punteggio per scegliere i core: 55% centralità semantica e 45% intensità normalizzata. Un massimo nullo produce un contributo nullo."],["rₓ, n_c, ℓₓᵧ","rₓ conta gli altri membri raggiungibili da x; n_c è il numero di idee nel circuito; ℓₓᵧ è la distanza del percorso minimo, ottenuta sommando 1/peso lungo i collegamenti. Se nessun membro è raggiungibile, cₓ = 0. N_c(x) indica i vicini interni; R(x) i membri raggiungibili."]],"core_limit":"Soglia = {ratio} × miglior punteggio; si conservano al massimo {max} core. Il confronto usa i valori prima dell’arrotondamento.","singleton":"Questo circuito contiene una sola idea: l’idea stessa è il core, senza confronto tra punteggi.","chart_title":"Membri e collegamenti del circuito","chart_caption":"Le posizioni riprendono la mappa e vengono adattate al riquadro. La direzione geografica non attribuisce un significato alle idee.","reading":"{tag} appartiene al circuito identificato da {core}. I circuiti descrivono la rete di affinità e vengono rilevati automaticamente.","labels":{"ideas":"Idee nella mappa","neighbors":"Vicini scelti: k","modularity":"Modularità Q","components":"Ingredienti normalizzati dell’idea selezionata","degree":"Forza interna D","closeness":"Vicinanza C","intensity":"Intensità relativa I","ranking":"Punteggi dei membri del circuito","cutoff":"Ogni barra mostra q; la linea tratteggiata è la soglia per i core. Piccole differenze possono dipendere dall’arrotondamento dei dati.","core":"Core","size":"Idee nel circuito","role":"Ruolo dell’idea"}},"importance":{"title":"Importanza","intro":"L’importanza stabilisce quali etichette hanno la precedenza quando lo spazio è limitato. Combina presenza nelle pubblicazioni, forza delle associazioni e ruolo di ponte nella rete.","steps":[{"title":"Portare tre misure sulla stessa scala","body":"Ogni misura viene divisa per il massimo osservato nella mappa. Si ottengono F, W e B, tutti tra 0 e 1. Se una misura è zero per tutte le idee, il suo contributo è zero."},{"title":"Sommare i contributi pesati","body":"Ogni ingrediente viene moltiplicato per il proprio peso e poi sommato. Il grafico mostra quanto ciascuno contribuisce davvero al risultato P: la lunghezza complessiva della barra è l’importanza dell’idea."},{"title":"Interpretare il risultato","body":"Un valore più alto assegna maggiore priorità all’etichetta durante la gestione di densità e sovrapposizioni. Le quattro fasce descrivono questo punteggio relativo alla mappa corrente."}],"definitions":[["fₓ / F","Numero di pubblicazioni contenenti l’idea, poi diviso per il massimo della mappa."],["wₓ / W","Somma delle forze aₓᵧ di tutte le associazioni dirette nel grafo di interazione, poi normalizzata."],["bₓ / B","Centralità di intermediazione: quanto spesso l’idea si trova sui percorsi minimi tra altre idee, poi normalizzata. I percorsi vengono calcolati contando i collegamenti, senza pesarli."],["σₛₜ","Numero di percorsi minimi tra s e t; σₛₜ(x) conta quelli che attraversano x. Le coppie senza un percorso non contribuiscono."]],"chart_caption":"I contributi si sommano; lo spazio restante fino a 1 non viene attribuito ad alcun ingrediente.","reading":"Per {tag}, P = {value}: priorità {label}. Questo punteggio regola la visibilità dell’etichetta; le coordinate sono determinate dalla disposizione semantica.","labels":{"components":["Ricorrenza · F","Forza delle associazioni · W","Ruolo di ponte · B"],"inputs":"Tre ingredienti normalizzati","contributions":"Contributi all’importanza","result":"Importanza P"}},"traces":{"title":"Tracce","intro":"Le tracce contano in quante pubblicazioni compare un’idea. È il conteggio più diretto della sua presenza in print(\"human\").","steps":[{"title":"Contare le pubblicazioni distinte","body":"Si raccolgono le pubblicazioni a cui è assegnato il tag dell’idea e si conta ciascuna una sola volta. Ripetere la stessa idea nel testo non aumenta il conteggio."},{"title":"Confrontare il conteggio con il corpus","body":"Il grafico divide le pubblicazioni della mappa tra quelle che contengono l’idea e quelle che non la contengono. La copertura ρ è una percentuale di contesto; il valore delle tracce rimane il numero intero T."},{"title":"Capire cosa misura","body":"Le tracce indicano presenza nelle pubblicazioni, senza pesi semantici o di rete. Due idee con lo stesso numero di tracce possono avere intensità e importanza diverse perché hanno associazioni diverse."}],"definitions":[["Pₓ","Insieme delle pubblicazioni distinte contenenti l’idea x."],["Tₓ","Numero di elementi di Pₓ: il valore delle tracce."],["N","Numero totale di pubblicazioni incluse nella mappa corrente."]],"chart_title":"Presenza dell’idea nelle pubblicazioni","chart_caption":"L’intera barra rappresenta il corpus corrente; i due segmenti sono conteggi di pubblicazioni.","reading":"{tag} lascia {count} tracce su {total} pubblicazioni incluse nella mappa.","labels":{"idea":"Idea","count":"Tracce T","with":"Contengono l’idea","without":"Altre pubblicazioni","total":"Pubblicazioni N","coverage":"Copertura ρ","publications":"Pubblicazioni associate"}},"pull":{"title":"Attrazione associativa","intro":"L’attrazione associativa misura quanto due idee tendono ad avvicinarsi. Parte dal significato delle parole e viene rafforzata dal loro uso insieme nelle pubblicazioni.","steps":[{"title":"Partire dal significato delle parole","body":"Ogni idea è rappresentata da un vettore: una sequenza di numeri che ne descrive le relazioni linguistiche. La similarità coseno confronta la direzione di due vettori GloVe. Il valore viene limitato tra 0 e 1: questa è la base G dell’attrazione."},{"title":"Misurare l’evidenza nelle pubblicazioni","body":"J misura la quota di pubblicazioni condivise rispetto a quelle che contengono almeno una delle due idee. C cresce con il numero di pubblicazioni condivise: una sola coincidenza pesa meno di un’associazione ripetuta. La curva mostra questa crescita, che rallenta verso 1."},{"title":"Combinare i due segnali","body":"Il contributo delle pubblicazioni può soltanto aumentare la base linguistica G. Viene applicato alla parte ancora disponibile, 1 − G, così P resta tra 0 e 1. Un’attrazione maggiore produce una distanza obiettivo d più piccola."},{"title":"Dall’attrazione complessiva al bagliore","body":"Per una singola idea si sommano le attrazioni dei suoi collegamenti nel grafo di disposizione: si ottiene H. Si divide per il massimo della mappa e si applica un esponente percettivo. Il valore V regola il trattamento luminoso dell’etichetta."}],"definitions_language":[["vₐ, vᵦ","Vettori delle due idee. Se una parola non ha un vettore GloVe, si usa il contesto delle idee con cui compare, quando disponibile."],["G","Similarità linguistica tra 0 e 1. clip limita i valori a questo intervallo; un vettore mancante produce una base nulla."]],"definitions_corpus":[["A, B","Numero di pubblicazioni con ciascuna idea."],["S","Numero di pubblicazioni condivise."],["J","Sovrapposizione di Jaccard: S / (A + B − S)."],["C","Confidenza dovuta alla ripetizione. Con S = 0, C = 0; il denominatore nell’esponente regola la velocità di crescita."]],"definitions_result":[["P","Attrazione finale della coppia, tra 0 e 1."],["d","Distanza obiettivo derivata da P. Il calcolo mantiene un minimo positivo anche quando P = 1."]],"definitions_glow":[["Hₓ","Somma delle attrazioni sui collegamenti dell’idea nel grafo di disposizione, inclusi quelli verso altri circuiti."],["Uₓ","Attrazione aggregata divisa per il massimo della mappa."],["Vₓ","Segnale visivo dopo la trasformazione percettiva. Con H massimo nullo il valore normalizzato è zero."],["Nₗ(x)","Vicini di x nel grafo di disposizione, che possono appartenere anche ad altri circuiti."]],"confidence_caption":"Il punto indica le pubblicazioni condivise della coppia mostrata. C esprime ripetizione nel corpus, non una probabilità statistica.","distance_caption":"La barra somma G e il contributo delle pubblicazioni. La mappa deve conciliare tutte le coppie in due dimensioni e separare eventuali sovrapposizioni: la distanza visibile può differire da d.","reading":"P contribuisce alla disposizione delle idee; V ne descrive il bagliore. Selezionare un’idea evidenzia le relazioni e mantiene la geografia della mappa.","labels":{"confidence":"Come cresce la confidenza C","shared":"Pubblicazioni condivise S","pull":"Attrazione finale P","language":"Base linguistica G","bonus":"Contributo delle pubblicazioni","distance":"Distanza obiettivo d","glow":"Attrazione normalizzata e segnale visivo","maximum":"Massima attrazione H"}},"connections":{"title":"Associazioni vicine","intro":"Le associazioni vicine sono i collegamenti diretti del grafo di interazione. Mostrano quali idee sono legate alla selezione e con quale forza.","steps":[{"title":"Aggiungere il contesto alla parola","body":"Il vettore di contesto c combina le idee presenti nelle stesse pubblicazioni: ciascuna pesa secondo la sovrapposizione Jaccard. Si combina poi questo contesto con il vettore linguistico v. normalize riporta un vettore a lunghezza 1, mantenendone la direzione."},{"title":"Calcolare la forza della coppia","body":"Si confrontano i vettori arricchiti u con la similarità coseno S. Si sommano poi la parte semantica positiva e la sovrapposizione J delle pubblicazioni. Per i collegamenti conservati si garantisce un peso minimo di 0.01."},{"title":"Decidere se conservare il collegamento","body":"Il collegamento entra nella rete se S è almeno {threshold}, oppure se esiste almeno una pubblicazione condivisa. La forza w determina poi l’ordine delle associazioni mostrate; l’elenco principale presenta le prime tre."},{"title":"Leggere la forza","body":"La scala interpreta w tra 0 e 1. Due coppie possono avere la stessa forza grazie a combinazioni diverse di similarità semantica e pubblicazioni condivise."}],"definitions_vectors":[["vₓ","Vettore linguistico normalizzato dell’idea."],["cₓ","Contesto: somma dei vettori linguistici normalizzati delle idee co-occorrenti, pesati con Jₓᵧ, poi normalizzata."],["uₓ","Vettore usato dalle associazioni. I coefficienti indicano il peso di linguaggio e contesto."],["C(x)","Insieme delle idee co-occorrenti con x che hanno un vettore linguistico disponibile."]],"definitions_score":[["S","Similarità coseno dei vettori arricchiti: può essere negativa, ma la parte negativa non contribuisce alla forza."],["J","Quota di pubblicazioni condivise: nₐᵦ / (nₐ + nᵦ − nₐᵦ), dove nₐ e nᵦ contano le pubblicazioni delle due idee e nₐᵦ quelle condivise."],["w","Forza del collegamento conservato. Il minimo 0.01 evita un peso nullo."]],"fallback":"Se manca uno dei due vettori si usa quello disponibile. Se mancano entrambi, il collegamento può comunque derivare da pubblicazioni condivise.","chart_caption":"La barra mostra i due contributi alla forza prima dell’eventuale minimo 0.01. Gli ingredienti usano i coefficienti della mappa corrente.","reading":"Le associazioni guidano collegamenti ed esplorazione del flusso. L’attrazione associativa della sezione precedente usa invece la base linguistica e una confidenza nella ripetizione per costruire la geografia.","labels":{"contributions":"Contributi alla forza dell’associazione","semantic":"Similarità arricchita","corpus":"Pubblicazioni in comune","or":"oppure","shared":"Pubblicazioni condivise","kept":"Collegamento conservato","yes":"sì","no":"no"}},"echoes":{"title":"Echi","intro":"Un’eco misura quanto coincidono le pubblicazioni associate a due idee. Usa soltanto la loro presenza nei testi.","steps":[{"title":"Contare ciò che è condiviso","body":"Si contano le pubblicazioni con la prima idea, con la seconda e con entrambe. Il grafico divide l’insieme complessivo in tre parti senza sovrapposizioni: solo la prima, entrambe, solo la seconda."},{"title":"Dividere la parte condivisa per il totale","body":"A + B − S conta le pubblicazioni contenenti almeno una delle due idee. Si sottrae S perché le pubblicazioni condivise sono state contate due volte in A + B. L’eco E è la parte condivisa divisa per questo totale."},{"title":"Interpretare punteggio ed evidenza","body":"E = 0 significa nessuna pubblicazione in comune; E = 1 significa esattamente lo stesso insieme di pubblicazioni. I valori intermedi descrivono una sovrapposizione parziale. La scala qualitativa aiuta a leggerli."}],"definitions":[["A","Pubblicazioni con la prima idea."],["B","Pubblicazioni con la seconda idea."],["S","Pubblicazioni condivise dalle due idee."],["E / J","Eco, uguale all’indice di Jaccard. Se l’insieme complessivo è vuoto, il valore è zero."]],"chart_title":"Come si ripartiscono le pubblicazioni","chart_caption":"L’intera barra è A + B − S. Il segmento condiviso determina il numeratore dell’eco.","reading":"Eco {value}: {shared} pubblicazioni condivise su {union} contenenti almeno una delle due idee.","evidence":"Leggi sempre anche il conteggio condiviso: un’eco di 1.00 può derivare da una sola pubblicazione. Il valore esprime sovrapposizione; la confidenza dovuta alla ripetizione viene calcolata separatamente nell’attrazione associativa.","labels":{"only_a":"Solo la prima idea","shared":"Entrambe le idee","only_b":"Solo la seconda idea"}},"flow":{"title":"Flusso del pensiero","diagram_hint":"percorso associativo","intro":"Il flusso è un percorso di esplorazione che parte dall’idea selezionata e costruisce un albero di associazioni. Le frecce seguono la costruzione dalla radice verso le altre idee.","steps":[{"title":"Ordinare i collegamenti candidati","body":"Si assegnano priorità p alle associazioni combinando forza, similarità e pubblicazioni condivise. Si considerano al massimo {candidates} idee: la radice e i suoi vicini diretti con priorità più alta. p è un punteggio di ordinamento e può superare 1."},{"title":"Costruire l’albero un passo alla volta","body":"La radice può avere al massimo {root} figli; ogni altra idea al massimo {children}; la profondità massima è {depth}. Si scelgono prima i rami della radice che superano la soglia f. Se nessuno la supera, si mantiene il primo candidato disponibile. Poi si aggiunge ogni volta l’aggancio a con il punteggio valido più alto, evitando cicli."},{"title":"Quantificare il carico e lo spessore","body":"Un ramo porta la propria forza e una parte del carico dei rami che proseguono. Si divide per il massimo dell’albero e si calcola lo spessore t. Anche forza diretta e profondità influiscono sullo spessore; il carico da solo non lo determina."},{"title":"Leggere il percorso","body":"Il diagramma riproduce l’albero calcolato per l’idea selezionata. La disposizione è schematica e le linee più spesse indicano un carico normalizzato maggiore. Le coordinate della mappa principale restano quelle della geografia semantica."}],"definitions_priority":[["w","Forza dell’associazione."],["S","Similarità semantica arricchita, limitata tra 0 e 1 per la priorità."],["h","Vale 1 se esiste almeno una pubblicazione condivisa, altrimenti 0."],["J","Sovrapposizione di Jaccard delle pubblicazioni."]],"definitions_tree":[["wₚ₁","Forza del candidato diretto con la priorità p più alta: è il riferimento per la soglia della radice."],["d","Profondità del genitore nell’albero; la radice ha profondità zero."],["n","Numero di figli già collegati al genitore. I piccoli termini sottratti favoriscono percorsi meno profondi e meno affollati."]],"definitions_load":[["Lᵦ","Carico del ramo b: forza diretta più il contributo ricorsivo dei rami figli."],["Uᵦ","Carico diviso per il massimo dell’albero, tra 0 e 1."],["D_d","Fattore di profondità dello spessore: 1.00, 0.74 e 0.56 per i livelli 1, 2 e 3."],["t","Spessore della linea centrale in pixel. La forza w usata qui è limitata a 0–1."],["F(b)","Insieme dei rami figli che proseguono dopo il ramo b."]],"chart_title":"Albero di esplorazione dell’idea selezionata","chart_caption":"Le frecce indicano genitore → figlio. È un percorso generato dal grafo, senza un significato causale o cronologico.","load_caption":"Sono mostrati i primi sei rami dell’albero e il relativo carico U. Nel diagramma schematico lo spessore illustra U; nella mappa si applica anche la formula completa di t.","reading":"Segui le frecce per esplorare le associazioni a partire dalla selezione. Un ramo più marcato sostiene una parte più consistente del percorso; la direzione dipende dalla radice scelta.","labels":{"edge":"Ramo di esempio","floor":"Soglia della radice f","reached":"Idee raggiunte","loads":"Carico normalizzato dei rami","example_load":"Carico L dell’esempio","width":"Spessore t dell’esempio","depth":"Fattori di profondità"}}},"controls":{"detail":"dettaglio","links":"collegamenti"}},"en":{"explanation_prefix":"Explanation","info_hint":"click a parameter name for its explanation","close_explanation":"Close explanation","search_placeholder":"find an idea...","view_traces":"view traces","buttons":{"intensity":"intensity","circuit":"circuit","importance":"importance","traces":"traces","pull":"associative pull","connections":"nearby associations","echoes":"echoes"},"labels":{"pull":"pull","shared":"shared","confidence":"confidence","breakdown":"Idea details","strength":"strength","context_semantic":"context semantic","echo":"echo","shared_posts":"shared publications","unresolved":"unresolved","member":"member","core":"core","minimum":"minimum","maximum":"maximum","weak":"weak","faint":"faint","emerging":"emerging","moderate":"moderate","strong":"strong","intense":"intense","low":"low","high":"high","essential":"essential","close":"close","ideas":"ideas"},"explanations":{"scale":"How to read the scale","rounding":"The bands refer to the displayed value, rounded to two decimal places.","rounded":"Intermediate values are rounded, so recomputing the result may produce a small difference in the final digit.","unavailable":"This map data does not contain the detail needed for this calculation.","no_pairs":"This idea has no available pair for a numerical example. The formulas still describe the method.","no_flow":"No available branch starts from this idea.","no_publications":"No associated publications.","pair":"Example from the map: {tag} ↔ {other}"},"fallback":{"title":"Methodology","body":"No additional methodology is available for this item."},"topics":{"intensity":{"title":"Intensity","intro":"Measures how active an idea is in the map through two parameters:","axis_x":"R","axis_y":"C","value_recurrence":"R","value_connections":"C","value_intensity":"I","value_activation":"A","formula_note":"Recurrence and connections have the same weight and are combined through a geometric mean. This way, a high value in only one dimension is not enough to produce a high activation.\nIntensity is then derived from activation by linearly mapping the value from the 0.00–1.00 scale to the 1.00–5.00 scale.","legend_recurrence":"R = recurrence","legend_connections":"C = connections","legend_activation":"A = activation","legend_intensity":"I = intensity","scale_title":"The qualitative assessment follows the displayed intensity value, rounded to two decimal places:","scale_1":"1.00 ≤ I < 2.00 → {label}","scale_2":"2.00 ≤ I < 3.00 → {label}","scale_3":"3.00 ≤ I < 4.00 → {label}","scale_4":"4.00 ≤ I < 5.00 → {label}","scale_5":"I = 5.00 → {label}","footer":"The displayed values (R, C, A, and I) are relative to the current map.","recurrence_definition":"Recurrence: relative frequency with which the idea appears in print(\"human\") publications.","connections_definition":"Connections: relative number of direct associations the idea has in the semantic map.","normalization_intro":"Both values are normalized against the maxima observed in the current map:","where_title":"where:","rx_definition":"r_x = number of publications in which the selected idea appears","rmax_definition":"r_max = maximum number of publications reached by a single idea","cx_definition":"c_x = number of direct associations of the selected idea","cmax_definition":"c_max = maximum number of direct associations reached by a single idea"},"circuit":{"title":"Circuit","intro":"A circuit is a group of ideas that the map identifies as particularly connected to one another. Its name comes from its central ideas, called cores.","steps":[{"title":"From affinities to groups","body":"For each idea, keep the k neighbours with the highest associative pull. A link enters the graph if either idea selects the other. Start with one idea per group, then merge the groups that most increase modularity Q: how much their internal connections exceed what the nodes’ overall strengths would lead us to expect."},{"title":"Measure centrality within the circuit","body":"Core selection combines internal connection strength, closeness along the network and intensity. Divide each ingredient by its maximum within the circuit. This makes the score q comparable across the circuit’s members."},{"title":"Select the core ideas","body":"Compare every score with the circuit’s best score. The dashed line marks the selection threshold. Rank ideas above the threshold by score, keeping at most three cores."},{"title":"Read the selected circuit","body":"Filled circles mark cores; the dashed ring marks the selected idea. Lines show links within this circuit in the layout graph. Membership describes the group as a whole and does not require a strong link between every pair."}],"definitions_graph":[["N","Ideas with enough data to build the graph; k cannot exceed N − 1. Fewer than two ideas produce no links."],["w_c","Sum of the weights of links inside circuit c, counting each link once."],["s_c","Sum of the strengths of all nodes in the circuit, including their links to other circuits."],["m","Sum of all link weights in the map. Q evaluates the complete division into circuits."]],"definitions_core":[["dₓ / Dₓ","dₓ sums the idea’s internal link weights; Dₓ is its normalized value."],["cₓ / Cₓ","cₓ measures closeness to other members along shortest paths, using distance 1/weight. It also accounts for how many members are reachable; Cₓ is normalized."],["iₓ / Iₓ","iₓ is intensity on the 1–5 scale; here Iₓ divides it by the circuit’s maximum intensity."],["qₓ","Core selection score: 55% semantic centrality and 45% normalized intensity. A zero maximum gives a zero contribution."],["rₓ, n_c, ℓₓᵧ","rₓ counts other members reachable from x; n_c is the number of ideas in the circuit; ℓₓᵧ is shortest-path distance, adding 1/weight along links. If no member is reachable, cₓ = 0. N_c(x) means internal neighbours; R(x) means reachable members."]],"core_limit":"Threshold = {ratio} × best score; keep at most {max} cores. Comparisons use values before rounding.","singleton":"This circuit contains a single idea, which is its core without any score comparison.","chart_title":"Circuit members and links","chart_caption":"Positions come from the map and are fitted into this panel. Geographic direction does not assign meaning to ideas.","reading":"{tag} belongs to the circuit identified by {core}. Circuits describe the affinity network and are detected automatically.","labels":{"ideas":"Ideas in the map","neighbors":"Chosen neighbours: k","modularity":"Modularity Q","components":"Normalized ingredients for the selected idea","degree":"Internal strength D","closeness":"Closeness C","intensity":"Relative intensity I","ranking":"Scores of circuit members","cutoff":"Each bar shows q; the dashed line is the core threshold. Small differences can result from rounded data.","core":"Cores","size":"Ideas in the circuit","role":"Idea’s role"}},"importance":{"title":"Importance","intro":"Importance determines which labels take priority when space is limited. It combines presence in publications, association strength and the idea’s role as a bridge in the network.","steps":[{"title":"Put three measures on the same scale","body":"Divide each measure by its maximum in the map. This gives F, W and B, all between 0 and 1. If a measure is zero for every idea, its contribution is zero."},{"title":"Add the weighted contributions","body":"Multiply each ingredient by its weight, then add the results. The chart shows how much each ingredient actually contributes to P: the combined bar length is the idea’s importance."},{"title":"Interpret the result","body":"A higher value gives the label greater priority when handling density and overlaps. The four bands describe this score relative to the current map."}],"definitions":[["fₓ / F","Number of publications containing the idea, divided by the map’s maximum."],["wₓ / W","Sum of the strengths aₓᵧ of every direct association in the interaction graph, then normalized."],["bₓ / B","Betweenness centrality: how often the idea lies on shortest paths between other ideas, then normalized. Paths are computed by counting links, without weighting them."],["σₛₜ","Number of shortest paths between s and t; σₛₜ(x) counts those passing through x. Disconnected pairs do not contribute."]],"chart_caption":"The contributions add together; the remaining space up to 1 is not assigned to any ingredient.","reading":"For {tag}, P = {value}: {label} priority. This score controls label visibility; coordinates are determined by the semantic layout.","labels":{"components":["Recurrence · F","Association strength · W","Bridge role · B"],"inputs":"Three normalized ingredients","contributions":"Contributions to importance","result":"Importance P"}},"traces":{"title":"Traces","intro":"Traces count how many publications contain an idea. This is the most direct count of its presence in print(\"human\").","steps":[{"title":"Count distinct publications","body":"Collect publications assigned the idea’s tag and count each one once. Repeating the same idea in a text does not increase the count."},{"title":"Compare the count with the corpus","body":"The chart divides the map’s publications into those containing the idea and those that do not. Coverage ρ is a percentage for context; the trace value remains the integer count T."},{"title":"Understand what the count measures","body":"Traces measure presence in publications, without semantic or network weights. Two ideas with the same trace count can have different intensity and importance because they have different associations."}],"definitions":[["Pₓ","Set of distinct publications containing idea x."],["Tₓ","Number of items in Pₓ: the trace count."],["N","Total publications included in the current map."]],"chart_title":"The idea’s presence in publications","chart_caption":"The whole bar represents the current corpus; both segments count publications.","reading":"{tag} leaves {count} traces across {total} publications included in the map.","labels":{"idea":"Idea","count":"Traces T","with":"Contain the idea","without":"Other publications","total":"Publications N","coverage":"Coverage ρ","publications":"Associated publications"}},"pull":{"title":"Associative pull","intro":"Associative pull measures how strongly two ideas tend to move closer. It starts from the meaning of the words and is reinforced by their use together in publications.","steps":[{"title":"Start from word meaning","body":"Each idea is represented by a vector: a sequence of numbers describing its linguistic relationships. Cosine similarity compares the directions of two GloVe vectors. The value is limited to 0–1, giving the baseline pull G."},{"title":"Measure evidence in publications","body":"J measures the share of common publications among those containing either idea. C grows with the number of shared publications: a single coincidence carries less weight than a repeated association. The curve shows this growth slowing as it approaches 1."},{"title":"Combine the two signals","body":"The publication contribution can only increase the linguistic baseline G. It is applied to the remaining space, 1 − G, keeping P between 0 and 1. A higher pull gives a smaller target distance d."},{"title":"From aggregate pull to glow","body":"For one idea, sum the pull of its links in the layout graph to obtain H. Divide by the map’s maximum, then apply a perceptual exponent. The resulting V controls the label’s luminous treatment."}],"definitions_language":[["vₐ, vᵦ","Vectors for the two ideas. When a word has no GloVe vector, use the context of ideas occurring with it, if available."],["G","Linguistic similarity between 0 and 1. clip limits values to this interval; a missing vector gives a zero baseline."]],"definitions_corpus":[["A, B","Number of publications containing each idea."],["S","Number of shared publications."],["J","Jaccard overlap: S / (A + B − S)."],["C","Confidence from repetition. When S = 0, C = 0; the denominator in the exponent controls how quickly it grows."]],"definitions_result":[["P","Final pairwise pull, between 0 and 1."],["d","Target distance derived from P. The calculation keeps a positive minimum even when P = 1."]],"definitions_glow":[["Hₓ","Sum of the pull on the idea’s layout links, including links to other circuits."],["Uₓ","Aggregate pull divided by the map’s maximum."],["Vₓ","Visual signal after the perceptual transformation. If the maximum H is zero, the normalized value is zero."],["Nₗ(x)","Neighbours of x in the layout graph, which may also belong to other circuits."]],"confidence_caption":"The point marks the shared publications for the example pair. C expresses repetition in the corpus, not a statistical probability.","distance_caption":"The bar adds G and the publication contribution. The map must fit all pairs into two dimensions and separate overlaps, so visible distance can differ from d.","reading":"P contributes to the layout of ideas; V describes their glow. Selecting an idea highlights its relationships while keeping the map’s geography.","labels":{"confidence":"How confidence C grows","shared":"Shared publications S","pull":"Final pull P","language":"Linguistic baseline G","bonus":"Publication contribution","distance":"Target distance d","glow":"Normalized pull and visual signal","maximum":"Maximum aggregate pull H"}},"connections":{"title":"Nearby associations","intro":"Nearby associations are the direct links in the interaction graph. They show which ideas connect to the selection and how strong those links are.","steps":[{"title":"Add context to the word","body":"The context vector c combines ideas appearing in the same publications, each weighted by Jaccard overlap. Combine this context with the linguistic vector v. normalize gives a vector length 1 while keeping its direction."},{"title":"Calculate the pair’s strength","body":"Compare the enriched vectors u using cosine similarity S. Add the positive semantic part and publication overlap J. Kept links are given a minimum weight of 0.01."},{"title":"Decide whether to keep the link","body":"A link enters the network if S is at least {threshold}, or if the pair shares at least one publication. Strength w then determines the order of the listed associations; the main list shows the top three."},{"title":"Read the strength","body":"The scale interprets w between 0 and 1. Two pairs can have the same strength through different combinations of semantic similarity and shared publications."}],"definitions_vectors":[["vₓ","The idea’s normalized linguistic vector."],["cₓ","Context: the sum of normalized linguistic vectors for co-occurring ideas, weighted by Jₓᵧ, then normalized."],["uₓ","Vector used for associations. Its coefficients give the weights of language and context."],["C(x)","Set of ideas co-occurring with x that have an available linguistic vector."]],"definitions_score":[["S","Cosine similarity of enriched vectors. It can be negative, but the negative part contributes no strength."],["J","Share of common publications: nₐᵦ / (nₐ + nᵦ − nₐᵦ), where nₐ and nᵦ count each idea’s publications and nₐᵦ counts shared publications."],["w","Strength of the kept link. The minimum 0.01 avoids a zero weight."]],"fallback":"If one vector is missing, use the available one. If both are missing, a link can still come from shared publications.","chart_caption":"The bar shows the two strength contributions before applying the minimum 0.01, using the current map’s coefficients.","reading":"Associations power links and flow exploration. Associative pull in the previous section instead uses the linguistic baseline and confidence in repetition to build the geography.","labels":{"contributions":"Contributions to association strength","semantic":"Enriched similarity","corpus":"Publications in common","or":"or","shared":"Shared publications","kept":"Link kept","yes":"yes","no":"no"}},"echoes":{"title":"Echoes","intro":"An echo measures how closely the publications associated with two ideas overlap. It uses only their presence in the texts.","steps":[{"title":"Count what is shared","body":"Count publications containing the first idea, the second idea and both. The chart divides the combined set into three non-overlapping parts: only the first, both, only the second."},{"title":"Divide the shared part by the total","body":"A + B − S counts publications containing either idea. Subtract S because A + B counted shared publications twice. The echo E is the shared part divided by this total."},{"title":"Interpret the score and its evidence","body":"E = 0 means no shared publications; E = 1 means exactly the same publication set. Values in between describe partial overlap. The qualitative scale helps you read them."}],"definitions":[["A","Publications containing the first idea."],["B","Publications containing the second idea."],["S","Publications shared by the two ideas."],["E / J","Echo, equal to the Jaccard index. An empty combined set gives zero."]],"chart_title":"How the publications are divided","chart_caption":"The whole bar is A + B − S. The shared segment determines the echo’s numerator.","reading":"Echo {value}: {shared} shared publications out of {union} containing either idea.","evidence":"Always read the shared count too: an echo of 1.00 can come from a single publication. The value describes overlap; confidence from repetition is calculated separately in associative pull.","labels":{"only_a":"Only the first idea","shared":"Both ideas","only_b":"Only the second idea"}},"flow":{"title":"Thought flow","diagram_hint":"association path","intro":"Flow is an exploration path starting from the selected idea and building a tree of associations. Arrows follow its construction from the root towards other ideas.","steps":[{"title":"Rank candidate links","body":"Assign priority p to associations using strength, similarity and shared publications. Consider at most {candidates} ideas: the root and its highest-priority direct neighbours. p is a ranking score and can exceed 1."},{"title":"Build the tree one step at a time","body":"The root can have at most {root} children; other ideas at most {children}; the maximum depth is {depth}. First choose root branches meeting threshold f. If none qualifies, keep the first available candidate. Then repeatedly add the valid attachment with the highest score a, avoiding cycles."},{"title":"Quantify load and thickness","body":"A branch carries its own strength plus part of the load of branches continuing beyond it. Divide by the tree’s maximum and calculate thickness t. Direct strength and depth also affect thickness; load alone does not determine it."},{"title":"Read the path","body":"The diagram reproduces the tree calculated for the selected idea. Its layout is schematic, and thicker lines indicate a larger normalized load. The main map keeps its semantic coordinates."}],"definitions_priority":[["w","Association strength."],["S","Enriched semantic similarity, limited to 0–1 for priority."],["h","1 when at least one publication is shared, otherwise 0."],["J","Jaccard overlap of publications."]],"definitions_tree":[["wₚ₁","Strength of the direct candidate with the highest priority p: the reference for the root threshold."],["d","Parent’s depth in the tree; the root is at depth zero."],["n","Number of children already attached to the parent. The small deductions favour shallower, less crowded paths."]],"definitions_load":[["Lᵦ","Branch b’s load: direct strength plus the recursive contribution of child branches."],["Uᵦ","Load divided by the tree’s maximum, between 0 and 1."],["D_d","Depth factor for thickness: 1.00, 0.74 and 0.56 at levels 1, 2 and 3."],["t","Central line thickness in pixels. Strength w used here is limited to 0–1."],["F(b)","Set of child branches continuing beyond branch b."]],"chart_title":"Explora             (node) => {
                const neighbors =
                    Array.isArray(
                        node.neighbors
                    )
                        ?
                        node.neighbors
                        :
                        [];

                neighbors.forEach(
                    (neighbor) => {
                        if (
                            !neighbor
                            ||
                            !neighbor.tag
                        ) {
                            return;
                        }

                        const key =
                            canonicalEdgeKey(
                                node.tag,
                                neighbor.tag
                            );

                        const metric =
                            byKey.get(
                                key
                            )
                            ||
                            {
                                source:
                                    node.tag,

                                target:
                                    neighbor.tag,

                                strength:
                                    0,

                                semantic:
                                    0,

                                cooccurrence:
                                    0,

                                jaccard:
                                    0,
                            };

                        mergeEdgeMetric(
                            metric,
                            neighbor
                        );

                        byKey.set(
                            key,
                            metric
                        );
                    }
                );
            }
        );


        return Array.from(
            byKey.values()
        );
    }


    function edgePriority(
        edge
    ) {
        const strength =
            clamp(
                numberOr(
                    edge.strength,
                    0
                ),
                0,
                1.5
            );

        const semantic =
            clamp(
                numberOr(
                    edge.semantic,
                    0
                ),
                0,
                1
            );

        const cooccurrence =
            clamp(
                numberOr(
                    edge.cooccurrence,
                    0
                ),
                0,
                1
            );

        const jaccard =
            clamp(
                numberOr(
                    edge.jaccard,
                    0
                ),
                0,
                1
            );

        return (
            strength
            +
            semantic
            *
            0.035
            +
            cooccurrence
            *
            0.15
            +
            jaccard
            *
            0.17
        );
    }


    function otherTag(
        edge,
        tag
    ) {
        if (
            edge.source
            ===
            tag
        ) {
            return edge.target;
        }

        if (
            edge.target
            ===
            tag
        ) {
            return edge.source;
        }

        return null;
    }


    function incidentEdges(
        graphEdges,
        tag
    ) {
        return graphEdges
            .filter(
                (edge) => (
                    edge.source
                    ===
                    tag

                    ||

                    edge.target
                    ===
                    tag
                )
            )
            .sort(
                (
                    a,
                    b
                ) => (
                    edgePriority(
                        b
                    )
                    -
                    edgePriority(
                        a
                    )
                )
            );
    }


    function buildCandidateTags(
        rootTag,
        graphEdges,
        options
    ) {
        const direct =
            incidentEdges(
                graphEdges,
                rootTag
            );

        const tags = [
            rootTag,
        ];

        for (
            const edge
            of
            direct
        ) {
            const tag =
                otherTag(
                    edge,
                    rootTag
                );

            if (
                !tag
                ||
                tags.includes(
                    tag
                )
            ) {
                continue;
            }

            tags.push(
                tag
            );

            if (
                tags.length
                >=
                options.maxCandidateNodes
            ) {
                break;
            }
        }

        return tags;
    }


    function chooseRootBranches(
        rootTag,
        candidateSet,
        graphEdges,
        options
    ) {
        const direct =
            incidentEdges(
                graphEdges,
                rootTag
            )
            .filter(
                (edge) => {
                    const child =
                        otherTag(
                            edge,
                            rootTag
                        );

                    return (
                        child
                        &&
                        candidateSet.has(
                            child
                        )
                    );
                }
            );

        if (
            !direct.length
        ) {
            return [];
        }

        const strongest =
            numberOr(
                direct[0]
                    .strength,
                0
            );

        const floor =
            Math.max(
                options
                    .rootBranchAbsoluteFloor,

                strongest
                *
                options
                    .rootBranchRelativeFloor
            );

        let selected =
            direct
                .filter(
                    (edge) => (
                        numberOr(
                            edge.strength,
                            0
                        )
                        >=
                        floor
                    )
                )
                .slice(
                    0,
                    options
                        .rootMaxChildren
                );

        if (
            !selected.length
        ) {
            selected =
                direct.slice(
                    0,
                    1
                );
        }

        return selected;
    }


    function buildSemanticTree(
        rootTag,
        graphEdges,
        options
    ) {
        const candidateTags =
            buildCandidateTags(
                rootTag,
                graphEdges,
                options
            );

        const candidateSet =
            new Set(
                candidateTags
            );

        const rootBranches =
            chooseRootBranches(
                rootTag,
                candidateSet,
                graphEdges,
                options
            );

        const connected =
            new Set([
                rootTag,
            ]);

        const depthByTag =
            new Map([
                [
                    rootTag,
                    0,
                ],
            ]);

        const childCount =
            new Map();

        const treeEdges = [];


        rootBranches.forEach(
            (edge) => {
                const child =
                    otherTag(
                        edge,
                        rootTag
                    );

                if (
                    !child
                    ||
                    connected.has(
                        child
                    )
                ) {
                    return;
                }

                treeEdges.push({
                    parent:
                        rootTag,

                    child,

                    depth:
                        1,

                    edge,
                });

                connected.add(
                    child
                );

                depthByTag.set(
                    child,
                    1
                );

                childCount.set(
                    rootTag,

                    (
                        childCount.get(
                            rootTag
                        )
                        ||
                        0
                    )
                    +
                    1
                );
            }
        );


        const subgraphEdges =
            graphEdges.filter(
                (edge) => (
                    candidateSet.has(
                        edge.source
                    )

                    &&

                    candidateSet.has(
                        edge.target
                    )
                )
            );


        while (
            connected.size
            <
            candidateSet.size
        ) {
            let best =
                null;


            for (
                const edge
                of
                subgraphEdges
            ) {
                const sourceConnected =
                    connected.has(
                        edge.source
                    );

                const targetConnected =
                    connected.has(
                        edge.target
                    );

                if (
                    sourceConnected
                    ===
                    targetConnected
                ) {
                    continue;
                }


                const parent =
                    sourceConnected
                        ?
                        edge.source
                        :
                        edge.target;

                const child =
                    sourceConnected
                        ?
                        edge.target
                        :
                        edge.source;

                const parentDepth =
                    depthByTag.get(
                        parent
                    );

                if (
                    !Number.isFinite(
                        parentDepth
                    )
                ) {
                    continue;
                }

                if (
                    parentDepth
                    >=
                    options.maxDepth
                ) {
                    continue;
                }


                const capacity =
                    parent
                    ===
                    rootTag
                        ?
                        options
                            .rootMaxChildren
                        :
                        options
                            .nodeMaxChildren;

                if (
                    (
                        childCount.get(
                            parent
                        )
                        ||
                        0
                    )
                    >=
                    capacity
                ) {
                    continue;
                }


                const depth =
                    parentDepth
                    +
                    1;

                if (
                    depth
                    >
                    options.maxDepth
                ) {
                    continue;
                }


                const score =
                    edgePriority(
                        edge
                    )
                    -
                    parentDepth
                    *
                    0.025
                    -
                    (
                        childCount.get(
                            parent
                        )
                        ||
                        0
                    )
                    *
                    0.008;


                if (
                    !best
                    ||
                    score
                    >
                    best.score
                ) {
                    best = {
                        parent,
                        child,
                        depth,
                        edge,
                        score,
                    };
                }
            }


            if (
                !best
            ) {
                break;
            }


            treeEdges.push({
                parent:
                    best.parent,

                child:
                    best.child,

                depth:
                    best.depth,

                edge:
                    best.edge,
            });


            connected.add(
                best.child
            );

            depthByTag.set(
                best.child,
                best.depth
            );

            childCount.set(
                best.parent,

                (
                    childCount.get(
                        best.parent
                    )
                    ||
                    0
                )
                +
                1
            );
        }


        return {
            rootTag,
            candidateTags,
            treeEdges,
            depthByTag,
            connected,
        };
    }


    function annotateTreeFlow(
        tree,
        options
    ) {
        if (
            !tree
            ||
            !Array.isArray(tree.treeEdges)
            ||
            !tree.treeEdges.length
        ) {
            return tree;
        }

        const childrenByParent = new Map();

        tree.treeEdges.forEach((relation) => {
            if (!childrenByParent.has(relation.parent)) {
                childrenByParent.set(relation.parent, []);
            }

            childrenByParent.get(relation.parent).push(relation);
        });

        let maximumLoad = 0;

        function branchLoad(relation) {
            const direct = clamp(
                numberOr(relation.edge && relation.edge.strength, 0),
                0,
                1.5
            );

            const children = childrenByParent.get(relation.child) || [];
            const downstream = children.reduce(
                (total, childRelation) => total + branchLoad(childRelation),
                0
            );

            const load = direct + options.downstreamFlowDecay * downstream;

            relation.flowLoadRaw = load;
            relation.descendantCount = children.reduce(
                (total, childRelation) => (
                    total
                    + 1
                    + numberOr(childRelation.descendantCount, 0)
                ),
                0
            );

            maximumLoad = Math.max(maximumLoad, load);
            return load;
        }

        const rootBranches = childrenByParent.get(tree.rootTag) || [];
        rootBranches.forEach(branchLoad);

        const denominator = Math.max(maximumLoad, 0.000001);

        tree.treeEdges.forEach((relation) => {
            relation.flowLoad = clamp(
                numberOr(relation.flowLoadRaw, 0) / denominator,
                0,
                1
            );
        });

        return tree;
    }


    // Angular distribution


    function buildIrregularAngles(
        key,
        count,
        options,
        offsetBase
    ) {
        if (
            count
            <=
            0
        ) {
            return [];
        }

        if (
            count
            ===
            1
        ) {
            return [
                seededUnit(
                    key,
                    offsetBase
                )
                *
                TWO_PI,
            ];
        }


        const weights = [];
        let totalWeight = 0;


        for (
            let index = 0;
            index < count;
            index += 1
        ) {
            const random =
                Math.pow(
                    seededUnit(
                        key,
                        offsetBase
                        +
                        100
                        +
                        index
                    ),

                    options
                        .angleGapExponent
                );

            const weight =
                lerp(
                    options
                        .angleGapWeightMin,

                    options
                        .angleGapWeightMax,

                    random
                );

            weights.push(
                weight
            );

            totalWeight +=
                weight;
        }


        const phase =
            seededUnit(
                key,
                offsetBase
                +
                1
            )
            *
            TWO_PI;

        const angles = [];
        let cursor = phase;


        for (
            let index = 0;
            index < count;
            index += 1
        ) {
            const localJitter =
                seededSigned(
                    key,
                    offsetBase
                    +
                    300
                    +
                    index
                )
                *
                0.035;

            angles.push(
                cursor
                +
                localJitter
            );

            cursor +=
                TWO_PI
                *
                (
                    weights[index]
                    /
                    totalWeight
                );
        }

        return angles;
    }


    // Organic paths


    function buildMainPoints(
        start,
        end,
        key,
        options
    ) {
        const dx =
            end.x
            -
            start.x;

        const dy =
            end.y
            -
            start.y;

        const vector =
            normalize(
                dx,
                dy
            );

        const length =
            vector.length;

        const tangentX =
            vector.x;

        const tangentY =
            vector.y;

        const normalX =
            -tangentY;

        const normalY =
            tangentX;


        const sectionCount =
            clamp(
                Math.round(
                    length
                    /
                    options
                        .pixelsPerSection
                ),

                options
                    .minControlPoints,

                options
                    .maxControlPoints
            );


        const amplitude =
            clamp(
                options
                    .minAmplitude
                +
                length
                *
                options
                    .amplitudeFactor,

                options
                    .minAmplitude,

                options
                    .maxAmplitude
            );


        const points = [
            {
                x:
                    start.x,

                y:
                    start.y,
            },
        ];


        let drift = 0;


        for (
            let index = 1;
            index <= sectionCount;
            index += 1
        ) {
            const t =
                index
                /
                (
                    sectionCount
                    +
                    1
                );

            const envelope =
                Math.pow(
                    Math.sin(
                        Math.PI
                        *
                        t
                    ),

                    0.96
                );


            drift =
                drift
                *
                0.48
                +
                seededSigned(
                    key,
                    100
                    +
                    index
                )
                *
                amplitude
                *
                (
                    0.28
                    +
                    seededUnit(
                        key,
                        200
                        +
                        index
                    )
                    *
                    0.48
                );


            const longitudinalJitter =
                seededSigned(
                    key,
                    300
                    +
                    index
                )
                *
                Math.min(
                    10,
                    length
                    *
                    0.022
                );


            points.push({
                x:
                    start.x
                    +
                    dx
                    *
                    t
                    +
                    tangentX
                    *
                    longitudinalJitter
                    +
                    normalX
                    *
                    drift
                    *
                    envelope,

                y:
                    start.y
                    +
                    dy
                    *
                    t
                    +
                    tangentY
                    *
                    longitudinalJitter
                    +
                    normalY
                    *
                    drift
                    *
                    envelope,
            });
        }


        points.push({
            x:
                end.x,

            y:
                end.y,
        });


        return points;
    }


    function buildSmoothPathFromPoints(
        points
    ) {
        if (
            !points.length
        ) {
            return "";
        }


        let path =
            "M "
            +
            points[0]
                .x
                .toFixed(
                    2
                )
            +
            " "
            +
            points[0]
                .y
                .toFixed(
                    2
                );


        for (
            let index = 0;
            index < points.length - 1;
            index += 1
        ) {
            const p0 =
                index
                ===
                0
                    ?
                    points[index]
                    :
                    points[
                        index
                        -
                        1
                    ];

            const p1 =
                points[index];

            const p2 =
                points[
                    index
                    +
                    1
                ];

            const p3 =
                index
                +
                2
                <
                points.length
                    ?
                    points[
                        index
                        +
                        2
                    ]
                    :
                    p2;


            const cp1 = {
                x:
                    p1.x
                    +
                    (
                        p2.x
                        -
                        p0.x
                    )
                    /
                    6,

                y:
                    p1.y
                    +
                    (
                        p2.y
                        -
                        p0.y
                    )
                    /
                    6,
            };


            const cp2 = {
                x:
                    p2.x
                    -
                    (
                        p3.x
                        -
                        p1.x
                    )
                    /
                    6,

                y:
                    p2.y
                    -
                    (
                        p3.y
                        -
                        p1.y
                    )
                    /
                    6,
            };


            path +=
                " C "
                +
                cp1.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                cp1.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                cp2.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                cp2.y
                    .toFixed(
                        2
                    )
                +
                ", "
                +
                p2.x
                    .toFixed(
                        2
                    )
                +
                " "
                +
                p2.y
                    .toFixed(
                        2
                    );
        }


        return path;
    }


    function buildOrganicMainPath(
        start,
        end,
        key,
        options
    ) {
        const points =
            buildMainPoints(
                start,
                end,
                key,
                options
            );

        return {
            points,

            d:
                buildSmoothPathFromPoints(
                    points
                ),
        };
    }
