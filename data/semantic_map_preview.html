    // Plotly traces


    function findTrace(layer) {
        return gd.data.findIndex(
            (trace) =>
                (
                    trace.meta
                    ||
                    {}
                ).layer
                ===
                layer
        );
    }


    function hideTrace(layer) {
        const index =
            findTrace(
                layer
            );

        if (index < 0) {
            return;
        }

        Plotly.restyle(
            gd,
            {
                x: [[]],
                y: [[]],
                visible: false,
            },
            [
                index,
            ]
        );
    }


    function updateHighlight(node) {
        const selectedIndex =
            findTrace(
                "highlight"
            );

        if (
            selectedIndex
            >=
            0
        ) {
            Plotly.restyle(
                gd,
                {
                    x: [[
                        node.x,
                    ]],

                    y: [[
                        node.y,
                    ]],

                    visible:
                        true,
                },
                [
                    selectedIndex,
                ]
            );
        }

        hideTrace(
            "neighbor-highlight"
        );
    }


    // Selection


    function relatedUrl(tag) {
        return (
            siteUrl
            +
            "/?tag="
            +
            encodeURIComponent(
                tag
            )
        );
    }


    function selectTag(node) {
        selectedTag =
            node.tag;

        updateHighlight(
            node
        );

        drawSelectedNeuralNetwork();

        showNodeInfo(
            node,
            true
        );

        updateLabels();
    }


    function clearSelection() {
        activeMethodologyTopic = null;
        selectedTag =
            null;

        clearNeuralNetwork();

        hideTrace(
            "highlight"
        );

        hideTrace(
            "neighbor-highlight"
        );

        hideInfoPanel();

        updateLabels();
    }


    // Search


    function findTag(query) {
        const normalized =
            String(
                query
                ||
                ""
            )
                .trim()
                .toLowerCase();

        if (!normalized) {
            return null;
        }

        return (
            nodes.find(
                (node) =>
                    node.tag
                        .toLowerCase()
                    ===
                    normalized
            )

            ||

            nodes.find(
                (node) =>
                    node.tag
                        .toLowerCase()
                        .startsWith(
                            normalized
                        )
            )

            ||

            nodes.find(
                (node) =>
                    node.tag
                        .toLowerCase()
                        .includes(
                            normalized
                        )
            )

            ||

            null
        );
    }


    function focusTag(query) {
        const node =
            findTag(
                query
            );

        if (!node) {
            return;
        }

        const widths = [
            1.65,
            1.15,
            0.72,
            0.42,
        ];

        const width =
            widths[
                Math.min(
                    Number(
                        node.level
                    ),
                    3
                )
            ];

        const height =
            width
            *
            1.02;

        Plotly.relayout(
            gd,
            {
                "xaxis.range": [
                    node.x
                    -
                    width
                    /
                    2,

                    node.x
                    +
                    width
                    /
                    2,
                ],

                "yaxis.range": [
                    node.y
                    -
                    height
                    /
                    2,

                    node.y
                    +
                    height
                    /
                    2,
                ],
            }
        ).then(
            () => {
                selectTag(
                    node
                );

                applyVisibility();
            }
        );
    }


    // Visibility


    function applyVisibility() {
        const detail =
            getDetailLevel();

        state.detail =
            detail;

        const show =
            [];

        const hide =
            [];

        gd.data.forEach(
            (
                trace,
                index
            ) => {
                const meta =
                    trace.meta
                    ||
                    {};

                const layer =
                    meta.layer;

                if (
                    layer
                    ===
                    "node"
                ) {
                    (
                        Number(
                            meta.visibilityLevel
                            ||
                            0
                        )
                        <=
                        detail
                            ? show
                            : hide
                    ).push(
                        index
                    );

                } else if (
                    layer
                    ===
                    "tag-edge"
                ) {
                    (
                        state.tagEdges
                        &&
                        detail >= 1
                            ? show
                            : hide
                    ).push(
                        index
                    );

                } else if (
                    layer
                    ===
                    "anchor-edge"
                ) {
                    (
                        state.anchorEdges
                            ? show
                            : hide
                    ).push(
                        index
                    );

                } else if (
                    layer
                    ===
                    "axis"
                ) {
                    (
                        state.axes
                            ? show
                            : hide
                    ).push(
                        index
                    );
                }
            }
        );

        const jobs =
            [];

        if (show.length) {
            jobs.push(
                Plotly.restyle(
                    gd,
                    {
                        visible:
                            true,
                    },
                    show
                )
            );
        }

        if (hide.length) {
            jobs.push(
                Plotly.restyle(
                    gd,
                    {
                        visible:
                            false,
                    },
                    hide
                )
            );
        }

        Promise
            .all(
                jobs
            )
            .then(
                scheduleOverlayUpdate
            );
    }


    // Overlay lifecycle


    function scheduleOverlayUpdate() {
        if (overlayFrame) {
            cancelAnimationFrame(
                overlayFrame
            );
        }

        overlayFrame =
            requestAnimationFrame(
                () => {
                    updateLabels();

                    redrawVisualModules();

                    refreshSelectedInfo();
                }
            );
    }


    function bindBackgroundDeselect() {
        const background =
            gd.querySelector(
                ".nsewdrag"
            );

        if (
            !background
            ||
            background
                .dataset
                .semanticBound
            ===
            "1"
        ) {
            return;
        }

        background
            .dataset
            .semanticBound =
            "1";

        background.addEventListener(
            "click",
            clearSelection
        );
    }


    // Responsive layout


    function applyResponsiveLayout() {
        if (responsiveTimer) {
            clearTimeout(
                responsiveTimer
            );
        }

        responsiveTimer =
            window.setTimeout(
                () => {
                    if (!gd.isConnected) {
                        return;
                    }

                    if (isMobile()) {
                        const height =
                            Math.max(
                                640,

                                Math.min(
                                    820,

                                    window.innerHeight
                                    *
                                    0.82
                                )
                            );

                        Plotly.relayout(
                            gd,
                            {
                                height,

                                "margin.l":
                                    18,

                                "margin.r":
                                    18,

                                "margin.t":
                                    62,

                                "margin.b":
                                    46,

                                "title.font.size":
                                    17,
                            }
                        ).then(
                            scheduleOverlayUpdate
                        );

                    } else {
                        Plotly.relayout(
                            gd,
                            {
                                height:
                                    860,

                                "margin.l":
                                    48,

                                "margin.r":
                                    48,

                                "margin.t":
                                    76,

                                "margin.b":
                                    60,

                                "title.font.size":
                                    20,
                            }
                        ).then(
                            scheduleOverlayUpdate
                        );
                    }
                },
                80
            );
    }


    // Initialization


    injectResponsiveStyles();

    createControls();

    bindBackgroundDeselect();

    initializeVisualModules();


    gd.on(
        "plotly_relayout",
        applyVisibility
    );


    gd.on(
        "plotly_afterplot",
        () => {
            bindBackgroundDeselect();

            scheduleOverlayUpdate();
        }
    );


    if (hasHover()) {
        gd.on(
            "plotly_hover",
            (event) => {
                if (selectedTag) {
                    return;
                }

                const point =
                    event.points
                    &&
                    event.points[0];

                if (!point) {
                    return;
                }

                const trace =
                    gd.data[
                        point.curveNumber
                    ];

                if (
                    (
                        trace.meta
                        ||
                        {}
                    ).layer
                    !==
                    "node"
                ) {
                    return;
                }

                const node =
                    nodesByTag.get(
                        point.customdata
                    );

                if (node) {
                    showNodeInfo(
                        node,
                        false
                    );
                }
            }
        );


        gd.on(
            "plotly_unhover",
            () => {
                if (!selectedTag) {
                    hideInfoPanel();
                }
            }
        );
    }


    gd.on(
        "plotly_click",
        (event) => {
            const point =
                event.points
                &&
                event.points[0];

            if (!point) {
                return;
            }

            const trace =
                gd.data[
                    point.curveNumber
                ];

            if (
                (
                    trace.meta
                    ||
                    {}
                ).layer
                !==
                "node"
            ) {
                clearSelection();

                return;
            }

            const node =
                nodesByTag.get(
                    point.customdata
                );

            if (node) {
                selectTag(
                    node
                );
            }
        }
    );


    document.addEventListener(
        "keydown",
        (event) => {
            if (
                event.key
                ===
                "Escape"
            ) {
                clearSelection();
            }
        }
    );


    window.addEventListener(
        "resize",
        () => {
            applyResponsiveLayout();

            scheduleOverlayUpdate();
        }
    );


    applyResponsiveLayout();

    applyVisibility();

    scheduleOverlayUpdate();


    if (ambientManager) {
        ambientManager.start();
    }

})();

(function () {
    "use strict";

    const gd = document.getElementById("semantic-map");
    const CONFIG = window.__PRINT_HUMAN_MAP_CONFIG__ || {};

    if (!gd) {
        return;
    }

    const INITIAL_WIDTH = Number(CONFIG.initialWidth) || 2.44;
    const MAX_ZOOM_OUT_SCALE = 0.25;
    const MAX_X_SPAN = INITIAL_WIDTH / MAX_ZOOM_OUT_SCALE;
    const MIN_VISUAL_SCALE = MAX_ZOOM_OUT_SCALE;
    const CLICK_TOLERANCE = 7;

    const ANCHOR_ICON_DATA_SIZE = 0.14;
    const ANCHOR_LABEL_PADDING_PX = 0.5;

    const FAMILY_ICON_Y_OFFSET = 0.17;
    const WORK_ICON_Y_OFFSET = -0.17;

    const anchorsByName = new Map(
        (CONFIG.anchors || []).map(
            (anchor) => [
                anchor.name,
                anchor,
            ]
        )
    );

    const nodeBaseSizes = new Map();
    const highlightBaseSizes = new Map();
    const anchorTraceNames = new Map();

    let pointerState = null;

    let visualFrame = null;

    let applyingVisualScale = false;

    let lastAppliedScale = null;
    let lastAnchorMarkerSize = null;

    let enforcingZoom = false;
    let configuringAxes = false;
    let configuringAnchors = false;


    // Plot geometry


    function captureTraceGeometry() {
        gd.data.forEach(
            (trace, index) => {
                const meta = trace.meta || {};
                const layer = meta.layer;

                if (
                    layer
                    ===
                    "node"
                ) {
                    const size =
                        trace.marker
                        &&
                        trace.marker.size;

                    if (
                        Array.isArray(size)
                    ) {
                        nodeBaseSizes.set(
                            index,
                            size.map(
                                (value) =>
                                    Number(value)
                            )
                        );

                    } else if (
                        Number.isFinite(
                            Number(size)
                        )
                    ) {
                        nodeBaseSizes.set(
                            index,
                            Number(size)
                        );
                    }
                }

                if (
                    layer
                    ===
                    "highlight"
                    ||
                    layer
                    ===
                    "neighbor-highlight"
                ) {
                    const size =
                        trace.marker
                        &&
                        trace.marker.size;

                    if (
                        Number.isFinite(
                            Number(size)
                        )
                    ) {
                        highlightBaseSizes.set(
                            index,
                            Number(size)
                        );
                    }
                }

                if (
                    layer
                    ===
                    "anchor"
                    &&
                    meta.anchorName
                ) {
                    anchorTraceNames.set(
                        index,
                        meta.anchorName
                    );
                }
            }
        );
    }


    function anchorTextPosition(name) {
        return {
            family:
                "top center",

            relationships:
                "middle right",

            society:
                "middle right",

            work:
                "bottom center",

            nature:
                "middle left",

            self:
                "middle left",
        }[name]
        ||
        "top center";
    }


    function anchorIconPosition(name) {
        const anchor =
            anchorsByName.get(
                name
            );

        if (
            !anchor
        ) {
            return null;
        }

        let x =
            Number(
                anchor.x
            );

        let y =
            Number(
                anchor.y
            );

        if (
            !Number.isFinite(x)
            ||
            !Number.isFinite(y)
        ) {
            return null;
        }

        if (
            name
            ===
            "family"
        ) {
            y +=
                FAMILY_ICON_Y_OFFSET;

        } else if (
            name
            ===
            "work"
        ) {
            y +=
                WORK_ICON_Y_OFFSET;
        }

        return {
            x,
            y,
        };
    }


    function configureAnchorGeometry() {
        if (
            configuringAnchors
        ) {
            return Promise.resolve();
        }

        configuringAnchors =
            true;

        const jobs = [];

        anchorTraceNames.forEach(
            (
                name,
                traceIndex
            ) => {
                const position =
                    anchorIconPosition(
                        name
                    );

                if (
                    !position
                ) {
                    return;
                }

                jobs.push(
                    Plotly.restyle(
                        gd,
                        {
                            x: [[
                                position.x,
                            ]],

                            y: [[
                                position.y,
                            ]],

                            mode:
                                "markers+text",

                            textposition:
                                anchorTextPosition(
                                    name
                                ),
                        },
                        [
                            traceIndex,
                        ]
                    )
                );
            }
        );

        return Promise
            .allSettled(
                jobs
            )
            .finally(
                () => {
                    configuringAnchors =
                        false;
                }
            );
    }


    function configureAxisGeometry() {
        configuringAxes =
            true;

        return Plotly.relayout(
            gd,
            {
                "xaxis.minallowed":
                    null,

                "xaxis.maxallowed":
                    null,

                "yaxis.minallowed":
                    null,

                "yaxis.maxallowed":
                    null,

                "xaxis.domain": [
                    0,
                    1,
                ],

                "yaxis.domain": [
                    0,
                    1,
                ],

                "xaxis.constrain":
                    "range",

                "yaxis.constrain":
                    "range",

                "yaxis.scaleanchor":
                    "x",

                "yaxis.scaleratio":
                    1,
            }
        ).finally(
            () => {
                configuringAxes =
                    false;
            }
        );
    }


    function currentXRange() {
        const axis =
            gd._fullLayout
            &&
            gd._fullLayout.xaxis;

        if (
            !axis
            ||
            !Array.isArray(
                axis.range
            )
            ||
            axis.range.length < 2
        ) {
            return null;
        }

        const start =
            Number(
                axis.range[0]
            );

        const end =
            Number(
                axis.range[1]
            );

        if (
            !Number.isFinite(start)
            ||
            !Number.isFinite(end)
        ) {
            return null;
        }

        return [
            start,
            end,
        ];
    }


    function enforceZoomOutLimit() {
        if (
            enforcingZoom
            ||
            configuringAxes
        ) {
            return;
        }

        const range =
            currentXRange();

        if (
            !range
        ) {
            return;
        }

        const span =
            Math.abs(
                range[1]
                -
                range[0]
            );

        if (
            span
            <=
            MAX_X_SPAN
            +
            0.000001
        ) {
            return;
        }

        const center =
            (
                range[0]
                +
                range[1]
            )
            /
            2;

        const half =
            MAX_X_SPAN
            /
            2;

        enforcingZoom =
            true;

        Plotly.relayout(
            gd,
            {
                "xaxis.range": [
                    center - half,
                    center + half,
                ],
            }
        ).finally(
            () => {
                enforcingZoom =
                    false;

                scheduleVisualScale();
            }
        );
    }


    // Marker and anchor spacing


    function currentVisualScale() {
        const range =
            currentXRange();

        if (
            !range
        ) {
            return 1;
        }

        const span =
            Math.abs(
                range[1]
                -
                range[0]
            );

        if (
            !Number.isFinite(span)
            ||
            span <= 0
        ) {
            return 1;
        }

        return Math.max(
            MIN_VISUAL_SCALE,

            Math.min(
                1,

                INITIAL_WIDTH
                /
                span
            )
        );
    }


    function scaledSize(
        baseSize,
        scale,
        minimum
    ) {
        if (
            Array.isArray(
                baseSize
            )
        ) {
            return baseSize.map(
                (value) =>
                    Math.max(
                        minimum,

                        Number(value)
                        *
                        scale
                    )
            );
        }

        return Math.max(
            minimum,

            Number(baseSize)
            *
            scale
        );
    }


    function anchorMarkerSizePixels() {
        const layout =
            gd._fullLayout;

        if (
            !layout
            ||
            !layout.xaxis
            ||
            !layout.yaxis
            ||
            typeof layout
                .xaxis
                .l2p
            !==
            "function"
            ||
            typeof layout
                .yaxis
                .l2p
            !==
            "function"
        ) {
            return 36;
        }

        const xPixels =
            Math.abs(
                layout
                    .xaxis
                    .l2p(
                        ANCHOR_ICON_DATA_SIZE
                    )
                -
                layout
                    .xaxis
                    .l2p(
                        0
                    )
            );

        const yPixels =
            Math.abs(
                layout
                    .yaxis
                    .l2p(
                        ANCHOR_ICON_DATA_SIZE
                    )
                -
                layout
                    .yaxis
                    .l2p(
                        0
                    )
            );

        const iconPixels =
            Math.max(
                1,

                Math.min(
                    xPixels,
                    yPixels
                )
            );

        return (
            iconPixels
            +
            ANCHOR_LABEL_PADDING_PX
            *
            2
        );
    }


    function applyVisualScale() {
        if (
            applyingVisualScale
            ||
            configuringAnchors
            ||
            !gd.isConnected
        ) {
            return;
        }

        const scale =
            currentVisualScale();

        const anchorMarkerSize =
            anchorMarkerSizePixels();

        const scaleUnchanged =
            lastAppliedScale
            !==
            null

            &&

            Math.abs(
                scale
                -
                lastAppliedScale
            )
            <
            0.001;

        const anchorSizeUnchanged =
            lastAnchorMarkerSize
            !==
            null

            &&

            Math.abs(
                anchorMarkerSize
                -
                lastAnchorMarkerSize
            )
            <
            0.5;

        if (
            scaleUnchanged
            &&
            anchorSizeUnchanged
        ) {
            return;
        }

        lastAppliedScale =
            scale;

        lastAnchorMarkerSize =
            anchorMarkerSize;

        applyingVisualScale =
            true;

        const jobs = [];


        nodeBaseSizes.forEach(
            (
                baseSize,
                traceIndex
            ) => {
                if (
                    !gd.data[
                        traceIndex
                    ]
                ) {
                    return;
                }

                jobs.push(
                    Plotly.restyle(
                        gd,
                        {
                            "marker.size": [
                                scaledSize(
                                    baseSize,
                                    scale,
                                    1.5
                                ),
                            ],
                        },
                        [
                            traceIndex,
                        ]
                    )
                );
            }
        );


        highlightBaseSizes.forEach(
            (
                baseSize,
                traceIndex
            ) => {
                if (
                    !gd.data[
                        traceIndex
                    ]
                ) {
                    return;
                }

                jobs.push(
                    Plotly.restyle(
                        gd,
                        {
                            "marker.size":
                                scaledSize(
                                    baseSize,
                                    scale,
                                    4
                                ),
                        },
                        [
                            traceIndex,
                        ]
                    )
                );
            }
        );


        anchorTraceNames.forEach(
            (
                name,
                traceIndex
            ) => {
                if (
                    !gd.data[
                        traceIndex
                    ]
                ) {
                    return;
                }

                jobs.push(
                    Plotly.restyle(
                        gd,
                        {
                            "marker.size":
                                anchorMarkerSize,

                            textposition:
                                anchorTextPosition(
                                    name
                                ),
                        },
                        [
                            traceIndex,
                        ]
                    )
                );
            }
        );


        Promise
            .allSettled(
                jobs
            )
            .finally(
                () => {
                    applyingVisualScale =
                        false;
                }
            );
    }


    function scheduleVisualScale() {
        if (
            visualFrame
        ) {
            cancelAnimationFrame(
                visualFrame
            );
        }

        visualFrame =
            requestAnimationFrame(
                () => {
                    visualFrame =
                        null;

                    applyVisualScale();
                }
            );
    }


    // Event helpers


    function distance(
        x1,
        y1,
        x2,
        y2
    ) {
        return Math.hypot(
            x2 - x1,
            y2 - y1
        );
    }


    function eventPath(event) {
        if (
            typeof event.composedPath
            ===
            "function"
        ) {
            return event.composedPath();
        }

        const path = [];

        let element =
            event.target;

        while (
            element
        ) {
            path.push(
                element
            );

            element =
                element.parentNode;
        }

        path.push(
            window
        );

        return path;
    }


    function pathContains(
        path,
        element
    ) {
        return Boolean(
            element
            &&
            path.includes(
                element
            )
        );
    }


    function pathMatches(
        path,
        selector
    ) {
        return path.some(
            (element) => {
                if (
                    !element
                    ||
                    element.nodeType !== 1
                    ||
                    typeof element.matches
                    !==
                    "function"
                ) {
                    return false;
                }

                try {
                    return element.matches(
                        selector
                    );

                } catch (error) {
                    return false;
                }
            }
        );
    }


    function isUiClick(path) {
        return (
            pathMatches(
                path,
                "#semantic-map-controls"
            )
            ||
            pathMatches(
                path,
                "#semantic-map-controls *"
            )
            ||
            pathMatches(
                path,
                "#semantic-map-info"
            )
            ||
            pathMatches(
                path,
                "#semantic-map-info *"
            )
            ||
            pathMatches(
                path,
                ".semantic-map-label"
            )
            ||
            pathMatches(
                path,
                ".semantic-map-label *"
            )
        );
    }


    function isNodeClick(path) {
        return (
            pathMatches(
                path,
                "path.point"
            )
            ||
            pathMatches(
                path,
                ".point"
            )
        );
    }


    // Selection


    function sendEscape() {
        const event =
            new KeyboardEvent(
                "keydown",
                {
                    key:
                        "Escape",

                    code:
                        "Escape",

                    keyCode:
                        27,

                    which:
                        27,

                    bubbles:
                        true,

                    cancelable:
                        true,
                }
            );

        if (
            document.body
        ) {
            document.body.dispatchEvent(
                event
            );

        } else {
            document.dispatchEvent(
                event
            );
        }
    }


    function handleMapClick(event) {
        const path =
            eventPath(
                event
            );

        if (
            !pathContains(
                path,
                gd
            )
        ) {
            return;
        }

        if (
            isUiClick(
                path
            )
        ) {
            return;
        }

        if (
            isNodeClick(
                path
            )
        ) {
            return;
        }

        sendEscape();
    }


    // Pointer state


    function handlePointerDown(event) {
        if (
            event.button !== 0
        ) {
            return;
        }

        const path =
            eventPath(
                event
            );

        if (
            !pathContains(
                path,
                gd
            )
        ) {
            pointerState =
                null;

            return;
        }

        pointerState = {
            pointerId:
                event.pointerId,

            startX:
                event.clientX,

            startY:
                event.clientY,

            moved:
                false,
        };
    }


    function handlePointerMove(event) {
        if (
            !pointerState
        ) {
            return;
        }

        if (
            event.pointerId
            !==
            pointerState.pointerId
        ) {
            return;
        }

        const movement =
            distance(
                pointerState.startX,
                pointerState.startY,
                event.clientX,
                event.clientY
            );

        if (
            movement
            >
            CLICK_TOLERANCE
        ) {
            pointerState.moved =
                true;
        }
    }


    function handlePointerUp(event) {
        if (
            !pointerState
        ) {
            return;
        }

        if (
            event.pointerId
            !==
            pointerState.pointerId
        ) {
            return;
        }

        pointerState =
            null;
    }


    function handlePointerCancel() {
        pointerState =
            null;
    }


    // Plot background


    function bindPlotBackgrounds() {
        const backgrounds =
            gd.querySelectorAll(
                ".nsewdrag"
            );

        backgrounds.forEach(
            (background) => {
                if (
                    background
                        .dataset
                        .printHumanDeselectBound
                    ===
                    "1"
                ) {
                    return;
                }

                background
                    .dataset
                    .printHumanDeselectBound =
                    "1";

                background.addEventListener(
                    "click",
                    sendEscape,
                    true
                );
            }
        );
    }


    // Plot lifecycle


    function bindPlotlyLifecycle() {
        if (
            typeof gd.on
            !==
            "function"
        ) {
            return;
        }

        gd.on(
            "plotly_relayout",
            () => {
                enforceZoomOutLimit();

                scheduleVisualScale();

                requestAnimationFrame(
                    bindPlotBackgrounds
                );
            }
        );

        gd.on(
            "plotly_afterplot",
            () => {
                bindPlotBackgrounds();

                scheduleVisualScale();
            }
        );
    }


    function observePlotlyDom() {
        const observer =
            new MutationObserver(
                () => {
                    bindPlotBackgrounds();
                }
            );

        observer.observe(
            gd,
            {
                childList:
                    true,

                subtree:
                    true,
            }
        );

        return observer;
    }


    // DOM events


    document.addEventListener(
        "click",
        handleMapClick,
        true
    );

    document.addEventListener(
        "pointerdown",
        handlePointerDown,
        true
    );

    document.addEventListener(
        "pointermove",
        handlePointerMove,
        true
    );

    document.addEventListener(
        "pointerup",
        handlePointerUp,
        true
    );

    document.addEventListener(
        "pointercancel",
        handlePointerCancel,
        true
    );

    window.addEventListener(
        "blur",
        handlePointerCancel
    );

    window.addEventListener(
        "resize",
        () => {
            lastAppliedScale =
                null;

            lastAnchorMarkerSize =
                null;

            scheduleVisualScale();
        }
    );


    // Initialization


    captureTraceGeometry();

    bindPlotBackgrounds();

    bindPlotlyLifecycle();

    observePlotlyDom();

    Promise
        .allSettled([
            configureAnchorGeometry(),
            configureAxisGeometry(),
        ])
        .finally(
            () => {
                enforceZoomOutLimit();

                scheduleVisualScale();
            }
        );

})();

                        });
                }
</script>        </div>
